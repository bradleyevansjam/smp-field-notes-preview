ن على الرصيف"}, {"en": "2 Look - both ways, wait for a safe gap", "ar": "2 انظروا - في الاتجاهين، وانتظروا فجوة آمنة"}, {"en": "3 Show - sign upright to traffic; step out only when safe", "ar": "3 أظهروا - اللوحة قائمة نحو السيارات؛ اخرجوا فقط عندما يكون ذلك آمناً"}, {"en": "4 Check - every lane stopped", "ar": "4 تأكدوا - كل المسارات متوقفة"}, {"en": "5 Call - 'Cross now, please' - stay until the last fan", "ar": "5 نادوا - «اعبروا الآن، من فضلكم» - ابقوا حتى آخر مشجع"}, {"en": "6 Clear - back to the kerb, sign down", "ar": "6 أخلوا - ارجعوا إلى الرصيف، وأنزلوا اللوحة"}, {"en": "Never wave fans across moving traffic.", "ar": "لا تجعلوا الجماهير تعبر أبداً بين سيارات متحركة."}]}, "traffic-5": {"drawer": "traffic", "code": "SMP 13.1", "released": true, "source": "smp131-traffic-crossings-parking/release/v3", "title": {"en": "Approved vehicle signals", "ar": "إشارات المركبات المعتمدة"}, "steps": [{"en": "STOP - one arm forwards, palm to driver", "ar": "قف - ذراع واحدة للأمام، والكف نحو السائق"}, {"en": "COME FORWARD - both hands beckoning", "ar": "تقدّم - كلتا اليدين بحركة استدعاء"}, {"en": "SLOW DOWN - arm out, palm down, up and down", "ar": "خفف السرعة - ذراع ممدودة وكفّ للأسفل، لأعلى وأسفل"}, {"en": "TURN - point with whole arm, then beckon", "ar": "انعطف - أشيروا بالذراع كاملة، ثم أومئوا"}, {"en": "STOP HERE - hands closing together", "ar": "قف هنا - اليدان تقتربان معاً"}, {"en": "EMERGENCY STOP - both arms forwards, palms to driver", "ar": "توقف طارئ - الذراعان للأمام، والكفان نحو السائق"}, {"en": "Approved signals only - never make up your own.", "ar": "الإشارات المعتمدة فقط - لا تخترعوا إشارة من عندكم أبداً."}]}, "traffic-6": {"drawer": "traffic", "code": "SMP 13.1", "released": true, "source": "smp131-traffic-crossings-parking/release/v3", "title": {"en": "Routes", "ar": "المسارات"}, "steps": [{"en": "Emergency routes: clear at ALL times - ask politely, report blocks at once.", "ar": "أبقوا مسارات الطوارئ خالية في جميع الأوقات. اطلبوا بلطف إزالة أي عوائق، وأبلغوا عنها فورًا."}, {"en": "Pedestrian routes: follow your supervisor's latest instruction - never change a route yourself.", "ar": "اتبعوا أحدث تعليمات مشرفكم بشأن مسارات المشاة، ولا تغيّروا أي مسار من تلقاء أنفسكم."}, {"en": "Crossing building up? Radio early: 'Sierra 2, Marshal 22. Crossing 3. Crowd building fast... Holding for traffic. Over.'", "ar": "هل يتزايد الحشد عند المعبر؟ أبلغوا مبكرًا عبر اللاسلكي: «سييرا 2، هنا المنظِّم 22. معبر 3. الحشد يتزايد بسرعة... أوقف حركة المشاة بانتظار مرور المركبات. حوّل»."}]}, "traffic-7": {"drawer": "traffic", "code": "SMP 13.1", "released": true, "source": "smp131-traffic-crossings-parking/release/v3", "title": {"en": "Emergency numbers", "ar": "أرقام الطوارئ"}, "steps": [{"en": "Only if you cannot reach your supervisor/VOC: 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "فقط إذا تعذّر الوصول إلى المشرف / مركز عمليات الملعب: 911 رقم الطوارئ الموحد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "sweep-1": {"drawer": "sweep", "code": "SMP 14.1", "released": true, "source": "smp141-observing-your-area-positioning-sweeps/release/v7", "title": {"en": "Eyes On - where to stand, how to watch", "ar": "راقبوا — أين تقفون وكيف تراقبون"}, "steps": [{"en": "See and be seen", "ar": "أن تَروا وأن تُرَوا"}, {"en": "Face the crowd - not the pitch", "ar": "واجهوا الجمهور، لا الملعب."}, {"en": "Out of the flow - not in doorways, on stairs or narrow points", "ar": "قفوا بعيدًا عن مسارات الحركة، ولا تقفوا في المداخل أو على الدرج أو في الممرات الضيقة."}, {"en": "Move a little to check blind spots", "ar": "تحرّكوا قليلًا لتفقد النقاط العمياء"}, {"en": "Scan near-far, left-right; look AND listen", "ar": "تفقدوا المكان من القريب إلى البعيد، ومن اليمين إلى اليسار، وانظروا واستمعوا."}, {"en": "Compare with 5 minutes ago", "ar": "قارنوا الوضع بما كان عليه قبل خمس دقائق."}, {"en": "After an incident - look again", "ar": "بعد أي حادث، أعيدوا تفقد المنطقة."}]}, "sweep-2": {"drawer": "sweep", "code": "SMP 14.1", "released": true, "source": "smp141-observing-your-area-positioning-sweeps/release/v7", "title": {"en": "Eyes On - sweep before gates open & after egress", "ar": "راقبوا — تفقدوا المنطقة قبل فتح البوابات وبعد خروج الجمهور"}, "steps": [{"en": "Small zones, row by row, top to bottom", "ar": "قسّموا المنطقة إلى أقسام صغيرة، وتفقدوها صفًا بعد صف، من الأعلى إلى الأسفل."}, {"en": "Under - behind - up; in pairs", "ar": "تفقدوا ما تحت الأشياء وخلفها وفوقها، واعملوا في فرق ثنائية"}, {"en": "Look for: trip hazards, spills, damage | BLOCKED EXITS | fire hazards | anything out of place | lost property | people who need help", "ar": "انتبهوا لأي شيء قد يسبب التعثر، أو لأي سوائل منسكبة أو تلف، وتأكدوا من أن المخارج خالية. وابحثوا عن مخاطر الحريق، والأشياء الموجودة في غير مكانها، والمفقودات، والأشخاص الذين يحتاجون إلى مساعدة.."}, {"en": "Places, not people or bags", "ar": "ركّزوا على الأماكن، لا على الأشخاص أو الحقائب."}, {"en": "End with 'Area clear'", "ar": "اختتموا بعبارة: «المنطقة خالية»."}]}, "sweep-3": {"drawer": "sweep", "code": "SMP 14.1", "released": true, "source": "smp141-observing-your-area-positioning-sweeps/release/v7", "title": {"en": "Eyes On - report", "ar": "راقبوا وأبلغوا"}, "steps": [{"en": "Small and safe? Fix it, then mention it. Anything else? Don't touch - keep people away - radio.", "ar": "إذا كانت المشكلة بسيطة وآمنة، عالجوها ثم أبلغوا عنها. أما إذا لم تكن كذلك، فلا تلمسوها، وأبعدوا الناس عنها، وأبلغوا عبر اللاسلكي."}, {"en": "Suspicious item? Don't touch. Move away before using your radio. 'Item of Interest'.", "ar": "غرض مشبوه؟ لا تلمسوه. ابتعدوا قبل استخدام اللاسلكي، وأبلغوا عنه بعبارة «غرض محل اهتمام»."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذّر عليكم التواصل مع مشرفكم أو مركز عمليات الملعب VOC): 911 رقم الطوارئ الموحد | 998 الدفاع المدني | 997 الهلال الأحمر السعودي (الإسعاف)."}]}, "tickets-1": {"drawer": "tickets", "code": "SMP 15.1", "released": true, "source": "smp151-ticket-checks-seat-replacement/release/v3", "title": {"en": "Look and scan", "ar": "انظروا وامسحوا"}, "steps": [{"en": "Look: right match and date · right gate · ticket ready", "ar": "انظروا: المباراة والتاريخ الصحيحان · البوابة الصحيحة · التذكرة جاهزة"}, {"en": "Look - don't take", "ar": "انظروا - ولا تأخذوا"}, {"en": "Scan: one fan, one scan", "ar": "امسحوا: مشجع واحد، مسح واحد"}, {"en": "Not valid? Step aside - check - try once more", "ar": "غير صالحة؟ التنحّي جانبًا - التحقق - المحاولة مرة أخرى"}, {"en": "Still a problem or scanner fault? → ticketing staff", "ar": "ما زالت هناك مشكلة أو عطل في جهاز المسح؟ ← موظفو التذاكر"}]}, "tickets-2": {"drawer": "tickets", "code": "SMP 15.1", "released": true, "source": "smp151-ticket-checks-seat-replacement/release/v3", "title": {"en": "Solve", "ar": "حُلّوا"}, "steps": [{"en": "Wrong gate → map and point", "ar": "بوابة خاطئة ← الخريطة والإشارة إلى الطريق"}, {"en": "Not valid / already used → ticketing staff", "ar": "غير صالحة / مستخدمة مسبقًا ← موظفو التذاكر"}, {"en": "Suspected fake or ticket seller → supervisor", "ar": "اشتباه في تذكرة مزوّرة أو بائع تذاكر ← المشرف"}, {"en": "Never: take a ticket or phone · accuse a fan · wave anyone through without a valid scan", "ar": "لا تفعلوا أبدًا: أخذ تذكرة أو هاتف · اتهام مشجع · إدخال أي شخص دون مسح صالح"}]}, "tickets-3": {"drawer": "tickets", "code": "SMP 15.1", "released": true, "source": "smp151-ticket-checks-seat-replacement/release/v3", "title": {"en": "Seat replacement (on instruction)", "ar": "استبدال المقعد (بناءً على تعليمات)"}, "steps": [{"en": "1 Verify - block, row, seat (wrong seat? show the right one)", "ar": "1 تحقّقوا - القطاع، الصف، المقعد (مقعد خطأ؟ أروه المقعد الصحيح)"}, {"en": "2 Coordinate - radio supervisor: where, what, who, what I'm doing", "ar": "2 نسّقوا - اتصلوا بالمشرف عبر اللاسلكي: أين، وماذا، ومن، وماذا أفعل"}, {"en": "3 Escort - only when told; post covered first; gangway clear", "ar": "3 رافقوا - فقط عندما تصلكم التعليمات؛ تأكدوا من تغطية موقعكم أولًا؛ والممر خالٍ"}, {"en": "4 Report - back on post, 'done'", "ar": "4 أبلغوا - العودة إلى الموقع، «تم»"}, {"en": "Never: choose a seat yourself · move anyone by force", "ar": "لا تفعلوا أبدًا: اختيار مقعد بأنفسكم · إبعاد أي شخص بالقوة"}, {"en": "My contacts: Supervisor {field:supervisor} · Ticketing point {field:ticketing} · Channel {field:channel}", "ar": "جهات الاتصال: المشرف {field:supervisor} · نقطة التذاكر {field:ticketing} · القناة {field:channel}"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا لم تتمكنوا من الوصول إلى مشرفكم/مركز عمليات الملعب): 911 الرقم الموحد للطوارئ | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "info-1": {"drawer": "info", "code": "SMP 15.2", "released": true, "source": "smp152-info-point-lost-found/release/v4", "title": {"en": "Info Point & Lost & Found", "ar": "نقطة المعلومات والمفقودات"}, "steps": [{"en": "Info Point: information | stroller parking | Lost & Found | children's registration | feedback | meeting point", "ar": "نقطة المعلومات: المعلومات | موقف عربات الأطفال | المفقودات | تسجيل الأطفال | الملاحظات | نقطة الالتقاء"}, {"en": "Lost something? → Info Point to report", "ar": "فقدتم شيئًا؟ ← نقطة المعلومات للإبلاغ"}, {"en": "Found something? → thank them → Info Point", "ar": "وجدتم شيئًا؟ ← اشكروهم ← نقطة المعلومات"}, {"en": "Never keep | never open | never hand to a claimer", "ar": "لا تحتفظوا | لا تفتحوا | لا تسلّموا لمن يدّعي الملكية"}, {"en": "Bag left alone? NOT lost property - don't touch, report", "ar": "حقيبة متروكة وحدها؟ ليست غرضًا مفقودًا - لا تلمسوها، أبلغوا عنها"}]}, "info-2": {"drawer": "info", "code": "SMP 15.2", "released": true, "source": "smp152-info-point-lost-found/release/v4", "title": {"en": "RIS & children's registration", "ar": "RIS وتسجيل الأطفال"}, "steps": [{"en": "Can't go in? Security decide → Rule - reason - option → RIS: store, label, collect after", "ar": "لا يمكن إدخاله؟ الأمن يقرر ← القاعدة - السبب - البديل ← RIS: الحفظ، ثم الملصق، ثم الاستلام بعد المباراة"}, {"en": "Not confiscation | not searching | dangerous items never stored → supervisor", "ar": "ليست مصادرة | ليست تفتيشًا | المواد الخطرة لا تُحفظ أبدًا ← المشرف"}, {"en": "Wristband: Tell - Write - Fasten - No record", "ar": "السوار: أخبروا - اكتبوا - ثبّتوا - بلا سجل"}, {"en": "Three details on the band | no form, no list | no photos", "ar": "ثلاث معلومات على السوار | لا نموذج ولا قائمة | لا صور"}]}, "info-3": {"drawer": "info", "code": "SMP 15.2", "released": true, "source": "smp152-info-point-lost-found/release/v4", "title": {"en": "My locations and help", "ar": "مواقعي والمساعدة"}, "steps": [{"en": "My Info Point: {field:infoPoint}", "ar": "أقرب نقطة معلومات: {field:infoPoint}"}, {"en": "RIS: {field:ris}", "ar": "RIS: {field:ris}"}, {"en": "Lost child? Supervisor first - 15-minute protocol (Lesson 9.3). Check for a wristband.", "ar": "طفل مفقود؟ المشرف أولًا - إجراء الـ15 دقيقة (الدرس 9.3). تحققوا من وجود سوار."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف/مركز عمليات الملعب (VOC)): 911 رقم الطوارئ الموحّد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "review-1": {"drawer": "review", "code": "SMP 16.1", "released": true, "source": "smp161-study-guide-final-quiz/release/v1", "title": {"en": "The 20 Golden Rules (1 to 7)", "ar": "القواعد الذهبية الـ20 (من 1 إلى 7)"}, "steps": [{"en": "Safety first, service always.", "ar": "السلامة أولًا، والخدمة دائمًا."}, {"en": "Marshals CANNOT search anyone. Marshals CANNOT eject anyone.", "ar": "لا يجوز لمنظم الحشود تفتيش أي شخص. ولا يجوز لمنظم الحشود إخراج أي شخص."}, {"en": "Never touch, push, pull, hold or block anyone.", "ar": "لا تلمسوا أي شخص ولا تدفعوه ولا تسحبوه ولا تمسكوه ولا تعترضوا طريقه أبدًا."}, {"en": "Never take (confiscate) anyone's property.", "ar": "لا تأخذوا (تصادروا) ممتلكات أحد أبدًا."}, {"en": "Your supervisor is always your first call.", "ar": "مشرفكم هو دائمًا أول من تتصلون به."}, {"en": "No answer, or getting worse? Call again, then go to your Area Leader.", "ar": "لا يوجد رد، أو الوضع يزداد سوءًا؟ اتصلوا مرة أخرى، ثم صعِّدوا إلى قائد منطقتكم."}, {"en": "Danger to life right now? Move people away, call the nearest Security, police or medical team, then report.", "ar": "هل حياة أحدهم في خطر الآن؟ أبعدوا الناس عن الخطر، واستعينوا بأقرب فرد من الأمن أو الشرطة أو الفريق الطبي، ثم أبلغوا."}]}, "review-2": {"drawer": "review", "code": "SMP 16.1", "released": true, "source": "smp161-study-guide-final-quiz/release/v1", "title": {"en": "The 20 Golden Rules (8 to 14)", "ar": "القواعد الذهبية الـ20 (من 8 إلى 14)"}, "steps": [{"en": "Never go silent. Keep your supervisor updated.", "ar": "لا تتوقفوا عن الإبلاغ أبدًا. أبقوا مشرفكم على اطّلاع."}, {"en": "Face the crowd, not the match.", "ar": "واجهوا الحشود، لا المباراة."}, {"en": "Keep exits, gangways and emergency routes clear at all times.", "ar": "أبقوا المخارج والممرات ومسارات الطوارئ خالية في جميع الأوقات."}, {"en": "Stop & Hold, opening gates and changing routes happen ONLY on instruction.", "ar": "الإيقاف والانتظار وفتح البوابات وتغيير المسارات تتم عند التعليمات فقط."}, {"en": "Spot it early, report it early. Small reports save lives.", "ar": "لاحظوا التغيرات و البوادر مبكرًا، وأبلغوا عنها مبكرًا. لأن البلاغات الصغيرة تنقذ الأرواح."}, {"en": "Radio: CALL SIGN, WHERE, WHAT, WHO, WHAT I'M DOING, OVER.", "ar": "اللاسلكي: رمز النداء، أين، ماذا، من، ماذا أفعل، حوّل."}, {"en": "Facts, not opinions. Never guess. Never spread rumours.", "ar": "حقائق لا آراء. لا تخمّنوا أبدًا. لا تنشروا الشائعات أبدًا."}]}, "review-3": {"drawer": "review", "code": "SMP 16.1", "released": true, "source": "smp161-study-guide-final-quiz/release/v1", "title": {"en": "The 20 Golden Rules (15 to 20)", "ar": "القواعد الذهبية الـ20 (من 15 إلى 20)"}, "steps": [{"en": "Stay on your post until you are relieved or stood down.", "ar": "ابقوا في نقطة تمركزكم حتى يحلّ أحد محلّكم أو تنتهي مناوبتكم."}, {"en": "Aggressive person? Step back, keep your distance, report. Never get physical.", "ar": "شخص عدواني؟ تراجعوا، وحافظوا على مسافتكم، وأبلغوا. ولا تتدخّلوا جسديًا أبدًا."}, {"en": "Suspicious item? Don't touch. Step back 15 metres. Say 'Item of Interest'. Never say 'bomb'.", "ar": "غرض مشبوه؟ لا تلمسوه. ابتعدوا 15 مترًا. قولوا «غرض محل اهتمام». لا تقولوا «قنبلة» أبدًا."}, {"en": "In an emergency, the agency in charge leads. Follow them, then tell your supervisor.", "ar": "في حالات الطوارئ، تتولى الجهة المسؤولة القيادة. اتبعوا تعليماتها، ثم أخبروا مشرفكم."}, {"en": "Ask first before you help anyone with a disability.", "ar": "استأذنوا أولًا قبل أن تساعدوا أي شخص من ذوي الاحتياجات الخاصة."}, {"en": "No photos of fans. No posting. Keep personal details private.", "ar": "ممنوع تصوير المشجعين. ممنوع النشر. حافظوا على سرية البيانات الشخصية."}]}, "review-4": {"drawer": "review", "code": "SMP 16.1", "released": true, "source": "smp161-study-guide-final-quiz/release/v1", "title": {"en": "Pocket check: before gates open", "ar": "قائمة تحقق للجيب: قبل فتح البوابات"}, "steps": [{"en": "Signed in, kit collected, radio check done (\"loud and clear\").", "ar": "تم تسجيل الحضور، واستلام المعدات، وأُجري فحص الاتصال («واضح ومسموع»)."}, {"en": "Written down: my post, supervisor call sign, Area Leader, break/prayer slot.", "ar": "تم تدوين: موقعي، رمز نداء المشرف، قائد المنطقة، موعد الاستراحة/الصلاة."}, {"en": "I know my nearest exit, first aid point, AED, assembly point and Info Point.", "ar": "أعرف أقرب مخرج لي، ونقطة الإسعافات الأولية، وجهاز الصدمات (AED)، ونقطة التجمع، ونقطة المعلومات."}, {"en": "Area swept: exits clear, no hazards. Reported \"area clear\".", "ar": "تم تفقد المنطقة: المخارج خالية، ولا مخاطر. تم الإبلاغ: «المنطقة آمنة وخالية»."}]}, "review-5": {"drawer": "review", "code": "SMP 16.1", "released": true, "source": "smp161-study-guide-final-quiz/release/v1", "title": {"en": "Pocket check: on post", "ar": "قائمة الجيب: في نقطة التمركز"}, "steps": [{"en": "Face the crowd. See and be seen. Out of the flow.", "ar": "واجهوا الجمهور. احرصوا على أن تروا الجمهور وأن يراكم. قفوا بعيدًا عن مسارات الحركة."}, {"en": "Spot it early, report it early. Facts, not opinions.", "ar": "لاحظوا مبكرًا، وأبلغوا مبكرًا. حقائق لا آراء."}, {"en": "Never touch, search, take, hold or eject anyone.", "ar": "لا تلمسوا أحدًا ولا تفتشوه ولا تأخذوا منه شيئًا ولا تمسكوه ولا تخرجوه أبدًا."}, {"en": "Stop & Hold, gates and routes - only on instruction.", "ar": "الإيقاف والانتظار، والبوابات والمسارات - عند التعليمات فقط."}]}, "review-6": {"drawer": "review", "code": "SMP 16.1", "released": true, "source": "smp161-study-guide-final-quiz/release/v1", "title": {"en": "Pocket check: at the end", "ar": "قائمة الجيب: في النهاية"}, "steps": [{"en": "Egress position when told. Stay until stood down.", "ar": "موقع الخروج عند تلقي التعليمات. ابقوا حتى تنتهي مناوبتكم."}, {"en": "Sweep - report - stand down - debrief.", "ar": "جولة تفقد - بلاغ - إنهاء المناوبة - إستخلاص الدروس"}, {"en": "Hand in incident cards. Return radio and kit. Sign out.", "ar": "سلّموا تقارير الحوادث. أعيدوا جهاز اللاسلكي والمعدات. سجّلوا انصرافكم."}]}, "radio-1": {"drawer": "radio", "code": "Library", "released": true, "source": "client checklist (Review 1 #30, JAM progress sheet 13.11.26)", "title": {"en": "Radio holders only: radio check", "ar": "لحاملي أجهزة اللاسلكي فقط: فحص الجهاز"}, "steps": [{"en": "Battery fully charged", "ar": "البطارية مشحونة بالكامل"}, {"en": "Earpiece working", "ar": "سماعة الأذن تعمل"}, {"en": "Correct channel set", "ar": "القناة الصحيحة مضبوطة"}, {"en": "Know all channels", "ar": "معرفة كل القنوات"}, {"en": "Call sign known", "ar": "رمز النداء معروف"}, {"en": "Sound check done", "ar": "تم فحص الصوت"}, {"en": "Faults reported to supervisor straight away", "ar": "إبلاغ المشرف بالأعطال فورًا"}, {"en": "Radio returned at end of shift", "ar": "إعادة الجهاز في نهاية المناوبة"}]}}, "emergency": [{"card": "fire-2", "label": "Fire or smoke", "icon": "flame"}, {"card": "shelter-2", "label": "Missile alert: move to shelter", "icon": "shield"}, {"card": "lost-2", "label": "Someone is lost", "icon": "search"}, {"card": "lost-3", "label": "Someone is found", "icon": "child"}, {"card": "crowd-2", "label": "Crowd danger signs", "icon": "crowd"}, {"card": "conflict-2", "label": "Aggression: amber and red", "icon": "alert"}], "numbers": "shelter-5", "fields": [{"key": "supervisor", "label": "My supervisor"}, {"key": "areaLeader", "label": "My Area Leader"}, {"key": "channel", "label": "My channel"}, {"key": "shelter", "label": "My shelter area"}, {"key": "codeword", "label": "Radio code word"}, {"key": "infoPoint", "label": "My Info Point"}, {"key": "ris", "label": "RIS (item storage)"}, {"key": "handover", "label": "Lost person hand-over to"}], "arApproved": {"EMERGENCY": "طوارئ", "Life in danger? Call 911 now. Don't wait for your supervisor.": "خطر على الحياة؟ اتصلوا على 911 فورًا، وما تنتظرون مشرفكم.", "Someone's life is in danger": "حياة شخص في خطر", "Someone is badly hurt, unconscious or not breathing": "شخص مصاب إصابة بالغة، أو مغمى عليه، أو ما يتنفس", "Fire or smoke and people can't get away": "حريق أو دخان، وما يقدر الناس يبتعدون", "Someone has a weapon or is attacking people": "شخص معه سلاح أو يعتدي على الناس", "People are being crushed in the crowd": "ناس ينضغطون وسط تدافع الحشد", "You are in danger yourself": "أنتم نفسكم في خطر", "Then tell your supervisor as soon as you can.": "بعدين بلّغوا مشرفكم في أقرب وقت ممكن.", "Call 911": "اتصلوا بالرقم 911", "Other emergency numbers: to be confirmed.": "أرقام الطوارئ الأخرى: قيد التأكيد.", "How to report": "كيفية الإبلاغ", "Who you tell, and how": "من تبلّغون، وكيف", "Marshals": "منظِّمو الحشود", "No radio": "بدون جهاز لاسلكي", "You": "أنتم", "Marshal": "منظِّم الحشود", "Supervisor": "المشرف", "Tell your superv setLang((function(){try{var q=new URLSearchParams(location.search).get('lang');return q==='ar'||q==='en'?q:''}catch(e){return''}})()||store.get('lang')||'en');  /* ?lang= from a course's Job aids panel (2026-11-15) */

/* ---- Learning hub (Fayez, 2026-11-14): five destinations; each branch opens in the menu; a link goes to its place on the page ---- */
const hub=document.getElementById('hub'),hubBtn=document.getElementById('hubbtn'),hubBack=document.getElementById('hubback');
const HUB_WIDE='(min-width:1180px)';let hubClosedWide=false;
function hubDests(){
  const P=D.phrases;
  return [
    {id:'lib',color:'var(--navy)',t:'Library',s:'Job aids by lesson',items:D.drawers.map(d=>({label:esc(L(d.label)),pre:lsn(d.code),act:'drawer:'+d.id}))},
    {id:'exp',color:'#B8862E',t:'Explore more',s:'Glossary and Arabic phrases',items:[{label:'Glossary',en:1,act:'pop:gl'},...(P?[{label:esc(lang==='ar'?P.headAr:'Common Arabic phrases'),act:'acc:sec-phr:phrbody'}]:[])]},
    {id:'notes',color:'var(--red)',cur:1,t:'Field notes & job aids',s:'Quick match-day references',items:[{label:esc(UI.em),act:'sec:em-after'},{label:esc(UI.find),act:'sec:sec-find'},{label:esc(UI.all),act:'acc:sec-all:allbody'}]},
    {id:'help',color:'var(--band-report,#15532F)',t:'Help & reporting',s:'Emergency 911 and how to report',items:[{label:esc(L('Emergency 911')),act:'sec:sec-em'},{label:esc(UI.report),act:'sec:sec-report'}]},
    {id:'mine',color:'var(--band-find,#26085C)',t:'My notes',s:'Your venue details, on this device',items:[{label:esc(L('My venue notes')),act:'pop:nt'}]}
  ];
}
function hubRender(){
  const open={};hub.querySelectorAll('.hd').forEach(d=>open[d.dataset.id]=d.classList.contains('open'));
  let h='<div class="hub-head"><h2 id="hubt">'+esc(L('Learning hub'))+'</h2><button class="hubx" id="hubx" type="button" aria-label="'+esc(L('Close the menu'))+'">✕</button></div>';
  h+='<label class="hubfind">'+svg('search')+'<input id="hubq" type="search" placeholder="'+esc(L('Find a lesson or resource…'))+'" aria-label="'+esc(L('Find a lesson or resource…'))+'" autocomplete="off"></label><div id="hubl">';
  hubDests().forEach(d=>{const o=open[d.id]!==undefined?open[d.id]:!!d.cur;
    h+='<div class="hd'+(d.cur?' cur':'')+(o?' open':'')+'" data-id="'+d.id+'"><button type="button" class="hdh" aria-expanded="'+o+'" aria-controls="hs-'+d.id+'"><span class="hdot" style="background:'+d.color+'"></span><span class="hdt"><b>'+esc(L(d.t))+'</b><small>'+esc(L(d.s))+'</small></span><span class="hchev" aria-hidden="true"></span></button>';
    h+='<ul class="hsub" id="hs-'+d.id+'">'+d.items.map(it=>'<li><button type="button" data-hub="'+it.act+'"'+(it.en?' lang="en"':'')+'>'+(it.pre?'<small>'+it.pre+'</small>':'')+it.label+'</button></li>').join('')+'</ul></div>'});
  h+='</div><p class="hubnone" id="hubnone" hidden>'+esc(L('Nothing found. Try another word.'))+'</p>';
  h+='<div class="hubfoot"><b>'+esc(L('5 destinations'))+'</b>'+esc(L('Lessons · resources · match-day help'))+'</div>';
  hub.innerHTML=h;hubBtn.querySelector('#hubbtnt').textContent=L('Menu');
  document.getElementById('hubx').onclick=()=>hubSet(false);
  document.getElementById('hubq').addEventListener('input',hubFilter);
}
const hubWide=()=>matchMedia(HUB_WIDE).matches;
const hubIsOpen=()=>document.documentElement.classList.contains('hubopen');
function hubSet(o,quiet){document.documentElement.classList.toggle('hubopen',o);hub.inert=!o;hubBtn.setAttribute('aria-expanded',o);
  if(hubWide())hubClosedWide=!o;
  if(!quiet&&o&&!hubWide())setTimeout(()=>{const q=document.getElementById('hubq');if(q)q.focus({preventScroll:true})},260);
  if(!quiet&&!o&&!hubWide())hubBtn.focus({preventScroll:true})}
function hubFit(){const w=hubWide();hubSet(w?!hubClosedWide:hubIsOpen()&&false,true)}
hubBtn.addEventListener('click',()=>hubSet(!hubIsOpen()));
hubBack.addEventListener('click',()=>hubSet(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&hubIsOpen()&&!hubWide()&&!glIsOpen())hubSet(false)});
addEventListener('resize',()=>{if(hubWide()!==hub._w){hub._w=hubWide();hubFit()}});
function hubFilter(){const q=document.getElementById('hubq').value.trim().toLowerCase();let n=0;
  hub.querySelectorAll('.hd').forEach(d=>{if(!q){d.hidden=false;d.querySelectorAll('.hsub li').forEach(li=>li.hidden=false);n++;return}
    const head=d.querySelector('.hdt').textContent.toLowerCase().includes(q);let any=head;
    d.querySelectorAll('.hsub li').forEach(li=>{const m=head||li.textContent.toLowerCase().includes(q);li.hidden=!m;if(m)any=true});
    d.hidden=!any;if(any){n++;d.classList.add('open');d.querySelector('.hdh').setAttribute('aria-expanded','true')}});
  document.getElementById('hubnone').hidden=n>0}
function hubAct(a){
  const [k,x,y]=a.split(':');
  if(k==='pop'){if(!hubWide())hubSet(false,true);glOpen(x);return}
  const run=()=>{let t;
    if(k==='drawer'){const r=main.querySelector('.lrow[data-drawer="'+x+'"]');const acc=main.querySelector('[data-acc="allbody"]');
      if(acc&&acc.getAttribute('aria-expanded')!=='true')acc.click();if(r&&!r.classList.contains('open'))r.click();t=r}
    else if(k==='acc'){const acc=main.querySelector('[data-acc="'+y+'"]');if(acc&&acc.getAttribute('aria-expanded')!=='true')acc.click();t=document.getElementById(x)}
    else t=k==='sec'&&x==='em-after'?main.querySelector('.em-after'):document.getElementById(x);
    if(t){t.scrollIntoView({behavior:'smooth',block:'start'});if(x==='sec-find'){const q=document.getElementById('q');if(q)setTimeout(()=>q.focus({preventScroll:true}),400)}}};
  if(!hubWide())hubSet(false,true);
  if(location.hash&&location.hash!=='#'){go('');setTimeout(run,60)}else run()}
hub.addEventListener('click',e=>{const h=e.target.closest('.hdh');if(h){const d=h.parentNode,o=d.classList.toggle('open');h.setAttribute('aria-expanded',o);return}
  const b=e.target.closest('[data-hub]');if(b)hubAct(b.dataset.hub)});
const _setLang=setLang;setLang=function(l){hub.style.transition='none';_setLang(l);hubRender();requestAnimationFrame(()=>requestAnimationFrame(()=>{hub.style.transition=''}))};   /* no slide across the screen when the language (and side) changes */
hubRender();hub._w=hubWide();hubSet(hubWide(),true);
/* SCORM 1.2 hook (field notes) */
(function(){function find(w){var n=0;while(w&&n<12){try{if(w.API)return w.API}catch(e){}if(w===w.parent)break;w=w.parent;n++}return null}
var api=find(window)||(window.opener?find(window.opener):null);if(!api)return;
try{api.LMSInitialize("");var s=api.LMSGetValue("cmi.core.lesson_status");
  if(s!=="completed"&&s!=="passed"){api.LMSSetValue("cmi.core.lesson_status","completed")}api.LMSSetValue("cmi.core.exit","");api.LMSCommit("")}catch(e){}
var done=false;function fin(){if(done)return;done=true;try{api.LMSCommit("");api.LMSFinish("")}catch(e){}}
window.addEventListener("pagehide",fin);window.addEventListener("beforeunload",fin)})();
</script>
<script>
/* review comments adapter for Field notes (published copy only) */
(function(){
var COURSE={id:"smp-field-notes",reviewSheet:"https://script.google.com/macros/s/AKfycbx5ytdUHl8PepmGOV02BoWL37g7uhVUnxN7YMKvlL85H3Ashe8Sx98be2LI5gApxkDK/exec"};
var KEYS=["home"].concat(Object.keys(D.cards));
var S=KEYS.map(function(k){return {id:k,sec:k==="home"?"":(D.cards[k].code||"")};}),cur=0,LANG=lang,T=null,SCRIPT;
function sync(){var m=location.hash.match(/^#card\/(.+)$/),i=m?KEYS.indexOf(m[1]):0;cur=i<0?0:i;LANG=lang;}
function g(id){return document.getElementById(id);}
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild;}
var render=function(){};
sync();
/* ---- Review comments (user, 2026-10-17): a comment box on every screen of a course under review ----
   Built in ONLY by build.py: in a --preview build (index.html) and in review.html beside a release build. Never in index.html of a
   release, never in the SCORM zip. Runs inside the engine's closure (S, cur, render, COURSE, LANG, T).
   Shared mode (COURSE.reviewSheet = the team's Google Sheet web app, system/docs/REVIEW-COMMENTS.md): every comment goes to the
   sheet and shows on its screen for every reviewer, with no login; reviewers cannot delete it — it leaves the course only when the
   team marks it Resolved in the sheet. A comment that cannot be sent yet waits in this browser and is sent when the line is back.
   Without a sheet: comments stay in this browser until the reviewer downloads them (CSV, opens in Excel) and sends the file. */
(function(){
var URL_=COURSE.reviewSheet||'',SHARED=!!URL_,KEY='ck-review-'+COURSE.id,QKEY=KEY+'-unsent',NAME='ck-review-name',BOM=String.fromCharCode(0xFEFF);
var mine=[],remote=[],mem=false,net='',lastLoad=0,sending=false;   /* mine: this browser's comments (all of them without a sheet; the unsent ones with one) */
try{mine=JSON.parse(localStorage.getItem(SHARED?QKEY:KEY)||'[]')||[];}catch(e){mem=true;}
function store(){try{localStorage.setItem(SHARED?QKEY:KEY,JSON.stringify(mine));}catch(e){mem=true;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function txt(v){try{return typeof T==='function'?T(v):(v&&v.en)||v||'';}catch(e){return '';}}
function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function here(){
  var d=S[cur]||{},sc=null;
  if(typeof SCRIPT!=='undefined'&&SCRIPT&&SCRIPT.screens)for(var i=0;i<SCRIPT.screens.length;i++)if(SCRIPT.screens[i].id===d.id){sc=SCRIPT.screens[i];break;}
  var h=document.querySelector('#main h2,#main h1,#main .kicker');
  var head=(sc&&txt(sc.heading))||(h?h.textContent:'')||'';
  return {id:d.id||'',sec:d.sec==null?'':String(d.sec),type:(sc&&sc.type)||'',head:String(head).replace(/\s+/g,' ').trim().slice(0,120),n:cur+1,of:S.length};
}
function all(){var seen={},out=[];remote.concat(mine).forEach(function(c){if(!seen[c.id]){seen[c.id]=1;out.push(c);}});return out;}
function sent(c){return !SHARED||remote.some(function(r){return r.id===c.id;});}
var KINDS=['Wording','Translation','Picture or video','Activity','Not working','Other'];
var tab=el('<button type="button" class="rv-tab" id="rvTab" aria-haspopup="dialog" aria-controls="rvPanel"><span class="rv-ic" aria-hidden="true">💬</span><span id="rvLbl">Comment</span> <b class="rv-n" id="rvN"></b></button>');
var tip=el('<div class="rv-tip" id="rvTip" role="note" hidden>Reviewers: tap here to leave a comment on this screen.</div>');
var pn=el('<div class="rv-panel" id="rvPanel" role="dialog" aria-modal="false" aria-labelledby="rvTitle" hidden>'+
  '<div class="rv-head"><h2 id="rvTitle">Review comments</h2><button type="button" class="rv-x" id="rvClose" aria-label="Close">✕</button></div>'+
  '<p class="rv-where" id="rvWhere"></p>'+
  '<ul class="rv-list" id="rvList"></ul>'+
  '<label class="rv-l" for="rvBy">Your name</label><input class="rv-in" id="rvBy" type="text" autocomplete="name">'+
  '<label class="rv-l" for="rvKind">What is it about?</label><select class="rv-in" id="rvKind">'+KINDS.map(function(k){return '<option>'+k+'</option>';}).join('')+'</select>'+
  '<label class="rv-l" for="rvText">Your comment on this screen</label><textarea class="rv-in" id="rvText" rows="4"></textarea>'+
  '<div class="rv-row"><button type="button" class="rv-b rv-save" id="rvSave">Save comment</button><span class="rv-msg" id="rvMsg" role="status"></span></div>'+
  '<div class="rv-foot"><p id="rvAll"></p><p class="rv-hint" id="rvHint"></p>'+
  '<div class="rv-row"><button type="button" class="rv-b" id="rvDown">Download all comments</button>'+(SHARED?'':'<button type="button" class="rv-b rv-quiet" id="rvClear">Delete all</button>')+'</div></div>'+
  '</div>');
document.body.appendChild(tab);document.body.appendChild(tip);document.body.appendChild(pn);
/* keep the button clear of the course: above the sticky button bar on a phone; the tip sits just above the button */
function pinned(e){   /* inside a bar that stays put on screen (sticky / fixed), not content that scrolls past */
  for(var n=e;n&&n.id!=='stage';n=n.parentElement){var p=getComputedStyle(n).position;if(p==='sticky'||p==='fixed')return true;}return false;}
function place(){   /* keep clear of the course: rise above the fixed bars (sticky Next bar, side lesson list) and, by a little, above
                       buttons near the bottom; use the bottom corner that is freest (the reading-start corner on a tie) */
  var w=tab.offsetWidth,h=tab.offsetHeight,start=getComputedStyle(document.documentElement).direction==='rtl'?'right':'left';
  var els=[].slice.call(document.querySelectorAll('#main button,#main a,#main input,#main select,#main [role=button]'))
    .map(function(e){var r=e.getBoundingClientRect();return {r:r,pin:pinned(e)};}).filter(function(x){return x.r.width&&x.r.height;});
  function fit(side){var left=side==='left'?16:innerWidth-16-w,bottom=16,hit=0;
    for(var pass=0;pass<8;pass++){var top=innerHeight-bottom-h,moved=false;
      els.forEach(function(x){var r=x.r;if(r.right>left&&r.left<left+w&&r.bottom>top&&r.top<top+h){var nb=innerHeight-r.top+10;
        if(x.pin||nb<=160){bottom=Math.max(bottom,nb);moved=true;}}});
      if(!moved)break;}
    bottom=Math.min(bottom,innerHeight*0.5);var top2=innerHeight-bottom-h;   /* what still lies under it: a fixed bar counts more (it cannot be scrolled away) */
    els.forEach(function(x){var r=x.r;if(r.right>left&&r.left<left+w&&r.bottom>top2&&r.top<top2+h)hit+=x.pin?10:1;});
    return {side:side,bottom:bottom,hit:hit};}
  var a=fit(start),b=fit(start==='left'?'right':'left');
  var best=(b.hit<a.hit||(b.hit===a.hit&&b.bottom<a.bottom))?b:a;
  tab.style.left=tip.style.left=best.side==='left'?'16px':'auto';tab.style.right=tip.style.right=best.side==='right'?'16px':'auto';
  tab.style.bottom=best.bottom+'px';tip.style.bottom=(best.bottom+h+10)+'px';}
window.addEventListener('resize',place);window.addEventListener('scroll',place,{passive:true});
var TIPKEY='ck-review-tip-seen';try{if(!localStorage.getItem(TIPKEY)){tip.hidden=false;setTimeout(function(){tip.hidden=true;},9000);}}catch(e){}
function tipDone(){tip.hidden=true;try{localStorage.setItem(TIPKEY,'1');}catch(e){}}
tip.addEventListener('click',function(){tipDone();open_();});
var by=g('rvBy');try{by.value=localStorage.getItem(NAME)||'';}catch(e){}
function onScreen(id){return all().filter(function(c){return c.screen===id;}).sort(function(a,b){return a.saved_at<b.saved_at?-1:1;});}
function refresh(){
  var w=here(),m=onScreen(w.id);
  g('rvN').textContent=m.length?String(m.length):'';place();
  tab.setAttribute('aria-label','Review comments'+(m.length?' ('+m.length+' on this screen)':''));
  if(pn.hidden)return;
  g('rvWhere').innerHTML='Screen <b>'+esc(w.id||'start')+'</b>'+(w.head?' · '+esc(w.head):'')+' <span>('+w.n+' of '+w.of+')</span>';
  g('rvList').innerHTML=m.map(function(c){var ok=sent(c);return '<li'+(ok?'':' class="rv-wait"')+'><span class="rv-k">'+esc(c.kind)+'</span> '+esc(c.comment)+
    '<small>'+esc(c.reviewer||'Reviewer')+' · '+esc(String(c.saved_at||'').slice(0,10))+(c.language?' · '+esc(c.language):'')+(ok?'':' · <b>Not sent yet</b>')+'</small>'+
    (ok&&SHARED?'':'<button type="button" class="rv-del" data-id="'+esc(c.id)+'">Delete</button>')+'</li>';}).join('');
  var n=all().length;
  g('rvAll').textContent=SHARED?(n===1?'1 open comment on this course.':n+' open comments on this course.'):(n===1?'1 comment saved in this course.':n+' comments saved in this course.');
  g('rvHint').textContent=SHARED?(net==='down'?'Cannot reach the comment sheet. Your comments are kept here and sent when the connection is back.':
      'Everyone reviewing this course sees these comments. The course team removes a comment when it is fixed.'):
    (mem?'This browser cannot keep comments. Download them before you close the page.':
      'Comments stay in this browser. When you finish, tap "Download all comments" and send the file back.');
  g('rvDown').disabled=!n;if(g('rvClear'))g('rvClear').disabled=!n;
}
/* ---- the shared sheet: read open comments, send waiting ones (plain-text POST: no login, no preflight) ---- */
function load(force){
  if(!SHARED||(!force&&Date.now()-lastLoad<15000))return;lastLoad=Date.now();
  fetch(URL_+(URL_.indexOf('?')<0?'?':'&')+'course='+encodeURIComponent(COURSE.id)+'&t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json();}).then(function(d){if(!d||!d.ok)throw 0;remote=d.comments||[];net='up';
      mine=mine.filter(function(c){return !remote.some(function(r){return r.id===c.id;});});store();refresh();})
    .catch(function(){net='down';refresh();});
}
function send(){
  if(!SHARED||sending||!mine.length)return;sending=true;
  var c=mine[0];
  fetch(URL_,{method:'POST',body:JSON.stringify({action:'add',comment:c})}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)throw 0;net='up';remote.push(c);mine=mine.filter(function(x){return x.id!==c.id;});store();sending=false;refresh();send();
  }).catch(function(){sending=false;net='down';refresh();});
}
function open_(){pn.hidden=false;tab.setAttribute('aria-expanded','true');g('rvMsg').textContent='';refresh();load();send();g('rvText').focus();}
function close_(){pn.hidden=true;tab.setAttribute('aria-expanded','false');tab.focus();}
tab.addEventListener('click',function(){tipDone();if(pn.hidden)open_();else close_();});
g('rvClose').addEventListener('click',close_);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pn.hidden)close_();});
g('rvSave').addEventListener('click',function(){
  var t=g('rvText').value.trim();if(!t){g('rvMsg').textContent='Type a comment first.';g('rvText').focus();return;}
  var w=here(),name=by.value.trim();try{localStorage.setItem(NAME,name);}catch(e){}
  mine.push({id:uid(),course:COURSE.id,screen:w.id,screen_no:w.n,lesson:w.sec,screen_type:w.type,heading:w.head,
    language:(typeof LANG!=='undefined'?LANG:''),kind:g('rvKind').value,comment:t,reviewer:name,saved_at:new Date().toISOString()});
  store();g('rvText').value='';g('rvMsg').textContent='Saved.';refresh();send();
});
g('rvList').addEventListener('click',function(e){var b=e.target.closest('.rv-del');if(!b)return;   /* only this browser's own, not-yet-sent comments */
  mine=mine.filter(function(c){return c.id!==b.getAttribute('data-id');});store();refresh();});
function csv(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
g('rvDown').addEventListener('click',function(){
  var cols=['course','screen','screen_no','lesson','screen_type','heading','language','kind','comment','reviewer','saved_at','id'];
  var rows=all().sort(function(a,b){return (a.screen_no-b.screen_no)||(a.saved_at<b.saved_at?-1:1);}).map(function(c){
    return cols.map(function(k){return csv(k==='course'?COURSE.id:c[k]);}).join(',');});
  var blob=new Blob([BOM+cols.join(',')+'\r\n'+rows.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'});
  var who=(by.value.trim()||'reviewer').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'reviewer';
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=COURSE.id+'-review-'+who+'.csv';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
});
if(g('rvClear'))g('rvClear').addEventListener('click',function(){
  if(!mine.length||!window.confirm('Delete all '+mine.length+' comments in this course? Download them first if you have not sent them.'))return;
  mine=[];store();refresh();
});
var _render=render;
render=function(i){_render(i);refresh();setTimeout(place,250);};
if(SHARED){load(true);send();setInterval(function(){if(!document.hidden){load();send();}},60000);window.addEventListener('online',function(){load(true);send();});}
window.addEventListener('beforeunload',function(e){if((mem||SHARED)&&mine.length&&(mem||net==='down')){e.preventDefault();e.returnValue='';}});
})();

window.addEventListener("hashchange",function(){sync();render(cur);});
document.addEventListener("click",function(e){if(e.target.closest(".lang"))setTimeout(function(){sync();render(cur);},50);});
render(cur);
})();
</script>
</body>
