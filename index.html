<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field notes and resources</title>
<style>
@font-face{font-family:'Archivo Narrow';font-weight:400 700;font-display:swap;src:url(brand/fonts/ArchivoNarrow[wght].ttf) format('truetype')}
@font-face{font-family:'Source Sans 3';font-weight:200 900;font-display:swap;src:url(brand/fonts/SourceSans3[wght].ttf) format('truetype')}
/* AFC SSP UI: Ubuntu (Ubuntu Font Licence 1.0, see UFL.txt) — Light 300, Regular 400, Medium 500; bold is drawn from Medium */
@font-face{font-family:'Ubuntu';font-style:normal;font-weight:300;font-display:swap;src:url(brand/fonts/Ubuntu-Light.ttf) format('truetype')}
@font-face{font-family:'Ubuntu';font-style:normal;font-weight:400;font-display:swap;src:url(brand/fonts/Ubuntu-Regular.ttf) format('truetype')}
@font-face{font-family:'Ubuntu';font-style:normal;font-weight:500 700;font-display:swap;src:url(brand/fonts/Ubuntu-Medium.ttf) format('truetype')}

:root{--band-notes:#6A4BB0;--navy:#0C272D;--ink:#0C272D;--muted:#676767;--faint:#8A8A8A;--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F4F3F0;--line:#CBBB9D;--line-2:#A6AAA9;--blue:#653BB8;--sky:#26085C;--sky-tint:#D9FBE4;--orange:#0C272D;--orange-d:#061A1F;--orange-tint:#D9FBE4;--orange-soft:#CBBB9D;--hilite:#D9FBE4;--on-orange:#FFFFFF;--font:'Ubuntu', 'Segoe UI', Arial, sans-serif;--font-display:'Ubuntu', 'Segoe UI', Arial, sans-serif;--font-ar:'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif;--bar-bg:#F1EAD8;--bar-fg:#0C272D;--bar-rule:0;--lang-on-bg:#0C272D;--lang-on-fg:#F1EAD8;--help-fg:#0C272D;--logo-h:44px;--band-report:#15532F;--band-find:#26085C;--band-notes:#D9FBE4;--band-notes-ink:#0C272D;--band-all:#0C272D;--page-bg:#E6DFCB;--red:#c4321a;--red-tint:#fdece8;--vest:#F2C200;--pad:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page-bg,#E9E6F1);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
[lang=ar] body,[lang=ar] input{font-family:var(--font-ar),var(--font)}
.app{max-width:760px;margin:0 auto;background:var(--surface-2);min-height:100vh;padding-bottom:28px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.bar{position:sticky;top:0;z-index:30;background:var(--bar-bg,var(--navy));border-bottom:var(--bar-rule,0);padding:10px var(--pad)}
.barrow{display:flex;align-items:center;justify-content:space-between;gap:10px;direction:ltr}
.logo{height:var(--logo-h,30px);width:auto;display:block}
.lang{display:inline-flex;border:2px solid var(--bar-fg,#fff);border-radius:4px;overflow:hidden}
.lang button{font-weight:700;font-size:13px;min-width:44px;min-height:34px;padding:0 8px;border:0;background:transparent;color:var(--bar-fg,#fff);cursor:pointer}
.lang button.on{background:var(--lang-on-bg,#fff);color:var(--lang-on-fg,var(--navy))}
/* scrolled past the 911 box (or scrolled on a card): the bar turns red with "Emergency? Call 911" (user, 2026-11-12) */
.bar{transition:background-color .2s}
.bar.hot{background:var(--red);border-bottom-color:var(--red)}
.bar.hot .lang{border-color:#fff}.bar.hot .lang button{color:#fff}.bar.hot .lang button.on{background:#fff;color:var(--red)}
.bar911{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-height:40px;color:#fff;font-weight:800;font-size:18px;text-decoration:none;white-space:nowrap}
.bar911[hidden]{display:none}
.bar911 svg{width:22px;height:22px;stroke:#fff;flex:none}
.bar911 b{font-size:22px}
.bar.hot .logo{filter:brightness(0) invert(1)}
@media(max-width:420px){.bar.hot .logo{display:none}.bar911{font-size:16px}}
.wrap{padding:0 12px}
h1,h2,h3,.ctitle{font-family:var(--font-display);color:var(--navy);margin:0}
/* ---- head + how to use ---- */
.head{padding:18px 4px 10px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--orange);margin:0 0 2px}
h1{font-size:30px;line-height:1.1}
.why{margin:6px 0 0;font-size:16px;color:var(--ink)}
.howto{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:600px){.howto{grid-template-columns:1fr}}
.howto li{display:flex}
.howgo{flex:1;display:grid;grid-template-columns:40px 1fr 14px;gap:10px;align-items:start;text-align:start;background:var(--surface);border:2px solid var(--line,#ddd);border-radius:4px;padding:8px 10px;font-size:15.5px;line-height:1.3;cursor:pointer}
.howgo:hover{border-color:var(--navy)}
.howarr{align-self:center;width:10px;height:10px;border-right:2.5px solid var(--navy);border-bottom:2.5px solid var(--navy);transform:rotate(45deg);margin-top:-4px}
#sec-em,#sec-report,#sec-find{scroll-margin-top:72px}
/* Return to top (user, 2026-11-12): small, bottom right; Arabic shows the arrow only until the round-2 proofread line arrives */
.totop{position:fixed;right:16px;bottom:16px;z-index:140;display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border:0;border-radius:22px;background:var(--navy);color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.totop[hidden]{display:none}
.totop:hover{filter:brightness(1.2)}
.totop:focus-visible{outline:3px solid #1f5fb8;outline-offset:3px}
.totop .up{width:9px;height:9px;border-left:2.5px solid currentColor;border-top:2.5px solid currentColor;transform:rotate(45deg);margin-top:4px}
@media print{.totop{display:none!important}}
.howto .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.howto .ic svg{width:22px;height:22px;stroke:#fff}
.howto b{color:var(--navy)}
/* ---- panels: each section its own card with a coloured band ---- */
.panel{background:var(--surface);border-radius:6px;margin:16px 0 0;overflow:hidden;border:1px solid var(--line)}
.band{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1;margin:0}
.band svg{width:24px;height:24px;stroke:#fff;flex:none}
.band small{display:block;font-family:var(--font);font-size:13px;font-weight:400;opacity:.92}
.pbody{padding:12px 14px 14px}
.b-report,.c-report{background:var(--band-report,var(--navy))}
.b-find,.c-find{background:var(--band-find,var(--orange))}
.b-em{background:var(--red)}.c-em{background:var(--red)}
.b-notes{background:var(--band-notes);color:var(--band-notes-ink,#fff)}.b-notes svg{stroke:var(--band-notes-ink,#fff)}
.b-all,.c-all{background:var(--band-all,var(--ink))}
/* ---- 911 ---- */
.sos{margin:6px 0 0;border:4px solid var(--red);border-radius:6px;padding:14px 16px 12px;background:var(--surface)}
.sos-k,.sos-n{text-align:center}
.sos-k{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--red);line-height:1}
.sos-n{display:block;font-family:var(--font-display);font-weight:700;font-size:88px;line-height:.95;color:var(--red);text-decoration:none;margin:2px 0 6px}
.sos-lead{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--red);line-height:1.25}
.sos-when{margin:0 0 8px;padding-inline-start:20px;font-size:16px;line-height:1.4;color:var(--ink)}
.sos-when li{margin:3px 0}
.sos-when li::marker{color:var(--red)}
.sos-then{margin:0 0 10px;font-weight:700;color:var(--navy)}
.sos-call{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;background:var(--red);color:#fff;font-weight:800;font-size:19px;text-decoration:none;border-radius:4px}
.sos-call svg{width:22px;height:22px;stroke:#fff}
.sos-other{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
/* ---- how to report: pictures first ---- */
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.who b{font-family:var(--font-display);font-size:21px;color:var(--navy)}
.kit{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy);background:var(--sky-tint);padding:3px 9px 3px 5px;border-radius:14px}
.kit svg{width:22px;height:22px}
.step{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.num{width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:24px;font-weight:700}
.pics{display:flex;align-items:flex-end;gap:2px;flex-wrap:nowrap;margin:0 0 6px;direction:ltr}
[dir=rtl] .pics{flex-direction:row-reverse;justify-content:flex-end}
.fig{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px}
.fig svg{width:40px;height:44px}
.fig span{font-size:11.5px;font-weight:700;color:var(--navy);line-height:1.1;text-align:center}
.fig.you span{background:var(--orange);color:#fff;border-radius:3px;padding:0 5px}
.arr{width:18px;height:44px;flex:none}
[dir=rtl] .arr{transform:scaleX(-1)}
.say{margin:0;font-size:18px;font-weight:700;line-height:1.3;color:var(--ink)}
.keep{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:10px 0 0;border-top:1px solid var(--line)}
.keep .eye{width:40px;height:40px;border-radius:50%;background:var(--sky-tint);display:grid;place-items:center}
.keep .eye svg{width:24px;height:24px;stroke:var(--navy)}
.lane2{margin-top:14px;border-top:3px solid var(--line);padding-top:12px}
.lane2 ul{margin:0;padding-inline-start:20px;font-size:15px;line-height:1.4}
.tbd{margin:6px 0 0;font-size:13px;color:var(--amber,#b9770a);font-weight:700}
.codes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.code{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px dashed var(--line-2,#A6AAA9);border-radius:4px;padding:8px 4px;text-align:center}
.code b{font-size:14px;color:var(--navy)}
.code small{font-size:12px;color:var(--muted)}
.cshape{width:22px;height:22px}
/* ---- find ---- */
.help{margin:0 0 10px;font-size:15.5px;line-height:1.35}
.search{position:relative}
/* simple search at the very top (user, 2026-11-12); while it has text the rest of home is hidden and only results show */
.topsearch{margin:4px 0 10px}
.topsearch input{border-color:var(--navy)}
#res0{margin:0 0 8px}
/* Glossary pop-out (user comment, 2026-11-13: "a small pop out menu"): small button beside the top search, panel slides in */
.toprow{display:flex;gap:8px;align-items:stretch;margin:4px 0 10px}
.toprow .topsearch{flex:1;margin:0}
.glbtn{display:flex;align-items:center;gap:6px;padding:0 14px;min-height:52px;border:2px solid var(--navy);border-radius:4px;background:var(--surface);color:var(--navy);font:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.glbtn svg{width:20px;height:20px;stroke:currentColor}
.glbtn:hover{background:var(--surface-2,#F1EAD8)}
.glbtn:focus-visible,.glx:focus-visible{outline:3px solid #1f5fb8;outline-offset:2px}
@media (max-width:640px){.glbtn span{display:none}.glbtn{padding:0 13px}}
.glback{position:fixed;inset:0;z-index:300;background:rgba(12,39,45,.45);opacity:0;transition:opacity .2s}
.glpop{position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:301;width:min(400px,92vw);display:flex;flex-direction:column;background:var(--surface);box-shadow:-4px 0 18px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .22s ease}
[dir=rtl] .glpop{transform:translateX(-100%);box-shadow:4px 0 18px rgba(0,0,0,.25)}
.glopen .glback{opacity:1}.glopen .glpop{transform:none}
.glpop[hidden],.glback[hidden]{display:none}
.glhead{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 16px;background:var(--band-all,var(--ink));color:#fff;font-family:var(--font-display);font-size:20px;font-weight:700}
.glhead svg{width:22px;height:22px;stroke:#fff}
.glhead span{flex:1}
.glx{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:28px;line-height:1;cursor:pointer}
.glx:hover{background:rgba(255,255,255,.15)}
.glin{padding:12px 14px 6px}
.glscroll{flex:1;overflow-y:auto;padding:0 14px 14px}
@media (prefers-reduced-motion:reduce){.glpop,.glback{transition:none}}
/* Common Arabic phrases (user, 2026-11-13): SMP 1.3's 12 approved phrases + its recordings */
.em-after{margin-top:10px}
.b-phr{background:var(--band-find,var(--orange))}
.phrh{padding:0}
.phrtog{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;cursor:pointer;color:#fff}
.phrtog:focus-visible{outline:3px solid #fff;outline-offset:-5px}
.phrtog>span:not(.chev){flex:1}
.phrtog .chev{flex:none;width:10px;height:10px;border:0;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg);margin:-4px 4px 0;transition:transform .2s}
.phrtog[aria-expanded=true] .chev{transform:rotate(-135deg);margin-top:4px}
.phr{list-style:none;margin:0;padding:0}
.phr li{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.phr li:last-child{border-bottom:0}
.phr .pn{grid-row:span 5;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.phr .pe{font-weight:700;font-size:16.5px}
.phr .pa{font-family:Arial,sans-serif;font-size:21px;font-weight:700;line-height:1.5}
.phr .ps{font-style:italic;color:var(--muted);font-size:14.5px}
.phr .pw{font-size:14px;color:var(--muted)}
.plays{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.play{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:6px 12px;border:2px solid var(--navy);border-radius:20px;background:var(--surface);color:var(--navy);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.play:hover{background:var(--surface-2,#F1EAD8)}
.play:focus-visible{outline:3px solid #1f5fb8;outline-offset:2px}
.play i{width:0;height:0;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent currentColor}
[dir=rtl] .play i{border-width:6px 10px 6px 0;border-color:transparent currentColor transparent transparent}
.play.on{background:var(--navy);color:#fff}
.play.on i{width:10px;height:10px;border:0;background:currentColor}
.gl{list-style:none;margin:0;padding:0}
.gl li{padding:10px 2px;border-bottom:1px solid var(--line)}
.gl li:last-child{border-bottom:0}
.gl .gt{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.gl .gt b{font-size:17px}
.gl .ga{font-family:Arial,sans-serif;font-size:18px;font-weight:700}
.gl .gs{font-size:14px;color:var(--muted)}
.gl .gm{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.gl-n{font-size:13px;color:var(--muted);margin:8px 0 0}
.search input{width:100%;font:inherit;font-size:17px;min-height:52px;padding:0 14px 0 44px;border:2px solid var(--orange);border-radius:4px;background:var(--surface);color:var(--ink)}
[dir=rtl] .search input{padding:0 44px 0 14px}
.search svg{position:absolute;inset-inline-start:13px;top:16px;width:20px;height:20px;stroke:var(--navy)}
#res{margin-top:12px}
.tryl{margin:10px 0 6px;font-size:14px;font-weight:700;color:var(--navy)}
.tries{display:flex;flex-wrap:wrap;gap:6px}
.try{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 12px;border:2px solid var(--orange-soft);border-radius:19px;background:var(--orange-tint);color:var(--navy);font-weight:700;font-size:14.5px;cursor:pointer}
.try svg{width:14px;height:14px;stroke:var(--navy)}
.try:hover{border-color:var(--orange)}
.rh{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
/* ---- emergency tiles ---- */
.emgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.em{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;background:var(--red-tint);border:2px solid #f3c3b8;border-radius:4px;padding:12px;min-height:104px;cursor:pointer}
.em svg{width:30px;height:30px;stroke:var(--red)}
.em b{font-family:var(--font-display);font-size:18px;line-height:1.1;color:var(--navy)}
.em span{font-size:12.5px;color:var(--muted);line-height:1.3}
.em:hover{border-color:var(--red)}
/* ---- notes ---- */
.notesbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:start;font-weight:700;color:var(--navy);min-height:44px}
.notes{padding:4px 0 0}
.nt{padding:6px 14px 14px}
.glsub{display:block;font-family:var(--font);font-size:13px;font-weight:400;opacity:.92}
.notes label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 3px}
.notes input{width:100%;font:inherit;min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:4px;color:var(--ink)}
.notes input:focus{border-color:var(--sky);outline:0}
.notes p{font-size:13px;color:var(--muted);margin:10px 0 0}
/* ---- all job aids: one uniform row per lesson ---- */
.lrow{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto 12px;gap:12px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-height:64px;cursor:pointer;text-align:start;color:var(--ink)}
.pbody>.lrow:first-child{border-top:0}
.lic{width:44px;height:44px;border-radius:6px;background:var(--sky-tint);display:grid;place-items:center}
.lic svg{width:24px;height:24px;stroke:var(--navy)}
.lt{display:flex;flex-direction:column;gap:1px;min-width:0}
.lt small{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--orange)}
.lt b{font-size:16.5px;line-height:1.2;color:var(--navy)}
.lt em{font-style:normal;font-size:12px;font-weight:700;color:var(--amber,#b9770a)}
.cnt{font-size:12.5px;font-weight:700;color:var(--navy);background:var(--sky-tint);border-radius:12px;padding:3px 9px;white-space:nowrap}
.chev{width:10px;height:10px;border-inline-end:3px solid var(--navy);border-bottom:3px solid var(--navy);transform:rotate(-45deg);flex:none}
[dir=rtl] .chev{transform:rotate(45deg)}
.open>.chev{transform:rotate(45deg)}
[dir=rtl] .open>.chev{transform:rotate(45deg)}
.drawer{display:none;padding:0 0 12px 56px}
[dir=rtl] .drawer{padding:0 56px 12px 0}
.lrow.open+.drawer{display:block}
.item{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:10px;align-items:center;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:10px 12px;margin:0 0 6px;min-height:52px;cursor:pointer;color:var(--ink)}
.item:hover{border-color:var(--sky)}
.item b{font-size:15px;line-height:1.25}
.item .tag{font-size:12px;color:var(--muted);white-space:nowrap}
.pdf{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--navy);background:var(--surface);border:2px solid var(--orange);border-radius:4px;padding:8px 12px;min-height:44px;text-decoration:none;margin-top:4px}
.pdf svg{width:18px;height:18px;stroke:var(--navy)}
/* ---- one card ---- */
.cardwrap{background:var(--surface);border-radius:6px;margin-top:6px;padding:4px 14px 14px;border:1px solid var(--line)}
.crumb{font-weight:700;color:var(--orange);background:none;border:0;padding:14px 0 6px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.crumb::before{content:"\2039";font-size:22px;line-height:1}
[dir=rtl] .crumb::before{content:"\203A"}
.cmeta{color:var(--muted);font-size:14px;margin:8px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.draft{font-size:12px;font-weight:700;color:var(--amber,#b9770a);border:1.5px solid currentColor;border-radius:3px;padding:0 6px}
.ctitle{font-size:28px;line-height:1.1;margin:0 0 12px}
.card.emc .ctitle{color:var(--red)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:12px 2px;font-size:17px;line-height:1.4}
.steps li:last-child{border-bottom:1px solid var(--line)}

خر 30 دقيقة"}, {"en": "Feel the match - watch the mood after goals and red cards", "ar": "تعيش المباراة - راقبوا المزاج بعد الأهداف والبطاقات الحمراء"}, {"en": "Move together - half-time concourses; exits at the final whistle", "ar": "تتحرك معًا - الممرات في استراحة ما بين الشوطين، والمخارج عند صافرة النهاية"}, {"en": "Loud and loyal - two teams, neutrals, families: treat everyone the same", "ar": "حماسية ووفية - فريقان ومحايدون وعائلات: عاملوا الجميع بالطريقة نفسها"}]}, "tour-3": {"drawer": "tour", "code": "SMP 1.2", "released": true, "source": "smp12-tournament-event-types/release/v1", "title": {"en": "OUR MISSION", "ar": "مهمتنا"}, "steps": [{"en": "SAFETY FIRST - SERVICE ALWAYS", "ar": "السلامة أولًا - الخدمة دائمًا"}, {"en": "Host - Direct - Inform - Assist - Support", "ar": "استضافة - توجيه - إعلام - مساعدة - دعم"}]}, "tour-4": {"drawer": "tour", "code": "SMP 1.2", "released": true, "source": "smp12-tournament-event-types/release/v1", "title": {"en": "WARNING SIGNS COME FIRST", "ar": "المؤشرات التحذيرية تأتي أولًا"}, "steps": [{"en": "Spot it early - report it early.", "ar": "لاحظوا مبكرًا - أبلغوا مبكرًا."}, {"en": "Emergency numbers (only if you cannot reach your supervisor or the VOC - the Venue Operations Centre): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف أو مركز العمليات في الملعب): 911 الرقم الموحد للطوارئ | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "role-1": {"drawer": "role", "code": "SMP 2.1", "released": true, "source": "smp21-role-authority/release/v2", "title": {"en": "NOT MY ROLE - NEVER", "ar": "ليس من دوري - أبدًا"}, "steps": [{"en": "✖ Touch, push, pull, hold or restrain anyone", "ar": "✖ لمس أي شخص أو دفعه أو سحبه أو إمساكه أو تقييده"}, {"en": "✖ Search a person or a bag", "ar": "✖ تفتيش شخص أو حقيبة"}, {"en": "✖ Take (confiscate) property", "ar": "✖ أخذ (مصادرة) الممتلكات"}, {"en": "✖ Eject or remove anyone", "ar": "✖ إخراج أي شخص أو إبعاده"},  هناك رد أو كان الوضع يزداد سوءًا"}, {"en": "Channel: {field:channel}", "ar": "القناة: {field:channel}"}, {"en": "FNP Venue Manager / Deputy → VOC", "ar": "مدير عمليات الجماهير في الملعب / نائبه ← مركز العمليات في الملعب"}, {"en": "Head of Marshals - attendance, food, water, uniform, equipment", "ar": "رئيس المنظمين - الحضور، والطعام، والماء، والزي، والمعدات"}]}, "role-4": {"drawer": "role", "code": "SMP 2.1", "released": true, "source": "smp21-role-authority/release/v2", "title": {"en": "Radio and team habits", "ar": "اللاسلكي وعادات الفريق"}, "steps": [{"en": "✖ Open emergency gates or start Stop & Hold unless instructed through your chain", "ar": "✖ فتح بوابات الطوارئ أو بدء الإيقاف والتثبيت دون تعليمات عبر تسلسلك القيادي"}, {"en": "Radio: CALL SIGN → WHERE → WHAT → WHO → WHAT I'M DOING → OVER", "ar": "اللاسلكي: رمز النداء ← أين ← ماذا ← من ← ماذا أفعل ← حوّل"}, {"en": "Team habits: Brief - Confirm - Stay - Support - Speak up", "ar": "عادات الفريق: الإحاطة - التأكيد - البقاء - الدعم - التحدّث"}]}, "role-5": {"drawer": "role", "code": "SMP 2.1", "released": true, "source": "smp21-role-authority/release/v2", "title": {"en": "MY ROLE - DO", "ar": "دوري - ما أفعله"}, "steps": [{"en": "SAFETY FIRST: watch crowd build-up - report early", "ar": "السلامة أولًا: راقب تزايد الحشود - وأبلغ مبكرًا"}, {"en": "SERVICE ALWAYS: Host - Direct - Inform - Assist - Support", "ar": "الخدمة دائمًا: الاستقبال - التوجيه - الإعلام - المساعدة - الدعم"}, {"en": "Keep exits, gangways and emergency routes clear", "ar": "أبقِ المخارج والممرات ومسارات الطوارئ خالية"}, {"en": "Observe - report - escalate", "ar": "راقب - أبلغ - صعّد"}, {"en": "Redirect fans to the right gate, route or service", "ar": "أعِد توجيه المشجعين إلى البوابة أو المسار أو الخدمة الصحيحة"}, {"en": "Move yourself and others away from danger", "ar": "ابتعد أنت والآخرون عن الخطر"}, {"en": "Follow briefings and instructions from your chain", "ar": "اتبع الإحاطات والتعليمات التي تأتيك عبر تسلسلك القيادي"}]}, "fire-1": {"drawer": "fire", "code": "SMP 5.2", "released": true, "source": "smp52-fire-safety/release/v4", "title": {"en": "Before gates open - E-X-I-T-S", "ar": "قبل فتح البوابات — فحص E-X-I-T-S"}, "steps": [{"en": "E Exits & routes open, unlocked, clear", "ar": "E — المخارج ومسارات الوصول مفتوحة وغير مقفلة وخالية."}, {"en": "X extinguishers in place - pin, seal, gauge green (where fitted)", "ar": "X — طفايات الحريق في أماكنها، ومسمار الأمان والختم سليمان، ومقياس الضغط في المنطقة الخضراء (إذا كانت الطفاية مزوّدة به)."}, {"en": "I Ignition - no smoking, safe cables, gas away from heat", "ar": "I — مصادر الاشتعال: لا تدخين، وأسلاك آمنة، والغاز بعيد عن الحرارة."}, {"en": "T Trash cleared", "ar": "T — أزيلوا النفايات."}, {"en": "S Signs lit, fire doors closed - never wedged, never locked", "ar": "S — اللافتات مضاءة، وأبواب الحريق مغلقة — لا تسندوها أو تقفلوها أبدًا."}, {"en": "Quick & safe? Fix + tell supervisor. Can't? Report now - open until fixed.", "ar": "هل يمكنكم معالجة الخلل بسرعة وأمان؟ عالجوه وأبلغوا المشرف. إذا تعذّر ذلك، فأبلغوا عنه فورًا — ويظل البلاغ مفتوحًا حتى معالجة الخلل."}, {"en": "Locked exit: report and STAY (from a safe position).", "ar": "المخرج المقفل: أبلغوا عنه وابقوا بالقرب منه (في مكان آمن)."}]}, "fire-2": {"drawer": "fire", "code": "SMP 5.2", "released": true, "source": "smp52-fire-safety/release/v4", "title": {"en": "Fire or smoke - R.I.E.F.A.", "ar": "حريق أو دخان — R.I.E.F.A."}, "steps": [{"en": "R Raise the alarm - radio 'Incident White' (no radio or no reply: fallback per briefing)", "ar": "R — أطلقوا الإنذار، وأبلغوا عبر اللاسلكي بوقوع «حادث أبيض» (إذا لم يتوفر اللاسلكي أو لم يصلكم رد، فاتبعوا الإجراء البديل الموضح في الإحاطة)."}, {"en": "I Inform - WHERE - WHAT - WHO - WHAT I'M DOING", "ar": "I — أبلغوا: الموقع — ما حدث — الأشخاص — ما الذي تفعلونه."}, {"en": "E Ensure people move away - calm, give a direction", "ar": "E — تأكّدوا من ابتعاد الأشخاص عن الخطر — وجّهوهم بهدوء وحددوا لهم الاتجاه."}, {"en": "F Fight only if authorised, trained and ALL 5 = YES. One extinguisher - not out, or conditions change? Get out.", "ar": "F — كافحوا الحريق فقط إذا كنتم مصرّحًا لكم ومدرّبين وكانت إجاباتكم عن الشروط الخمسة كلها «نعم». استخدموا طفاية واحدة — إذا لم ينطفئ الحريق أو تغيّرت الظروف، فاخرجوا."}, {"en": "A Assist Civil Defence - they command", "ar": "A — ساعدوا الدفاع المدني — فهو يتولى القيادة."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 (Riyadh, Makkah and Eastern regions) | 997 Red Crescent ambulance", "ar": "أرقام الطوارئ (إذا تعذّر الوصول إلى مشرفكم أو مركز العمليات في الملعب): 911 (في مناطق الرياض ومكة المكرمة والشرقية) | 997 إسعاف الهلال الأحمر."}]}, "fire-3": {"drawer": "fire", "code": "SMP 5.2", "released": true, "source": "smp52-fire-safety/release/v4", "title": {"en": "Extinguishers and P.A.S.S.", "ar": "طفايات الحريق و P.A.S.S."}, "steps": [{"en": "Read the LABEL, not the colour.", "ar": "اقرؤوا الملصق لا اللون."}, {"en": "A solids | B liquids & gas (gas leak: get out, report) | C electrical | D metals | K cooking oil", "ar": "A الأجسام الصلبة | B السوائل والغاز (تسرّب غاز: اخرجوا وأبلغوا) | C الكهرباء | D المعادن | K زيت الطهي"}, {"en": "Powder ABC | CO2 B-C | Water A only | Foam A-B | Wet chemical K | Blanket as labelled", "ar": "البودرة ABC | CO2 B-C | الماء A فقط | الرغوة A-B | الكيماويات الرطبة K | البطانية حسب الملصق"}, {"en": "P.A.S.S. Pull - Aim low - Squeeze - Sweep.", "ar": "P.A.S.S. اسحبوا - صوّبوا إلى الأسفل - اضغطوا - حرّكوا."}, {"en": "Back away facing the fire.", "ar": "تراجعوا إلى الخلف وأنتم تواجهون الحريق."}, {"en": "Evacuation? Follow instructions - see Lesson 10.2 card.", "ar": "إخلاء؟ اتبعوا التعليمات - راجعوا بطاقة الدرس 10.2."}]}, "crowd-1": {"drawer": "crowd", "code": "SMP 6.1", "released": true, "source": "smp61-crowd-safety-matters/release/v3", "title": {"en": "How full is it?", "ar": "ما مدى الامتلاء؟"}, "steps": [{"en": "Fine - about 2 in a 1 m square; walk freely. Green.", "ar": "جيد - نحو 2 في مربع مساحته متر واحد؛ المشي بحرية. أخضر."}, {"en": "Busy - about 3; slower, small gaps. Orange.", "ar": "مزدحم - نحو 3؛ أبطأ، فجوات صغيرة. برتقالي."}, {"en": "Getting full - about 4; touching. Red, from 8 out of 10 full → REPORT NOW.", "ar": "يمتلئ - نحو 4؛ تلامس. أحمر، من «ممتلئ بنسبة 8 من 10» → بلّغوا الآن."}, {"en": "At capacity - nearly 5; shoulder to shoulder. Red → REPORT URGENTLY.", "ar": "عند السعة - قرابة 5؛ كتف إلى كتف. أحمر → بلّغوا بصورة عاجلة."}, {"en": "Getting full? Report NOW - don't wait for 'at capacity'.", "ar": "يمتلئ المكان؟ بلّغوا الآن - لا تنتظروا «عند السعة»."}]}, "crowd-2": {"drawer": "crowd", "code": "SMP 6.1", "released": true, "source": "smp61-crowd-safety-matters/release/v3", "title": {"en": "Danger signs - look & listen", "ar": "علامات الخطر - انظروا واستمعوا"}, "steps": [{"en": "Pushing; swaying / waves", "ar": "دفع؛ تمايل / موجات"}, {"en": "Shouting, screaming", "ar": "صراخ، عويل"}, {"en": "Distressed faces, children lifted", "ar": "وجوه في ضائقة، أطفال مرفوعون"}, {"en": "Arms pinned, climbing out", "ar": "أذرع محشورة، تسلق للخروج"}, {"en": "Flow slowing or stopping", "ar": "تدفق يبطؤ أو يتوقف"}, {"en": "Someone falls", "ar": "شخص يسقط"}, {"en": "Overheating, fainting", "ar": "حرارة شديدة، إغماء"}]}, "crowd-3": {"drawer": "crowd", "code": "SMP 6.1", "released": true, "source": "smp61-crowd-safety-matters/release/v3", "title": {"en": "Surge moments and hot-spots", "ar": "لحظات الاندفاع والنقاط الساخنة"}, "steps": [{"en": "SURGE MOMENTS: late arrivals - kick-off - goals - half-time - final whistle.", "ar": "لحظات الاندفاع: الوصول المتأخر، انطلاق المباراة، الأهداف، استراحة ما بين الشوطين، صافرة النهاية."}, {"en": "HOT-SPOTS: gates, stairways, vomitories, kiosks/toilets/prayer areas, exits, corners, last mile.", "ar": "النقاط الساخنة: البوابات، السلالم، ممرات الدخول، الأكشاك/دورات المياه/أماكن الصلاة، المخارج، الزوايا، الميل الأخير."}]}, "crowd-4": {"drawer": "crowd", "code": "SMP 6.1", "released": true, "source": "smp61-crowd-safety-matters/release/v3", "title": {"en": "What I do", "ar": "ما أفعله"}, "steps": [{"en": "Face the crowd", "ar": "واجهوا الحشد"}, {"en": "Report early (CALL SIGN → WHERE → WHAT → WHO → WHAT I'M DOING → OVER)", "ar": "بلّغوا مبكرًا (اسم النداء → أين → ماذا → من → ماذا أفعل → حوّل)"}, {"en": "Keep routes clear", "ar": "أبقوا الطرق خالية"}, {"en": "Direct to space", "ar": "التوجيه نحو المساحة"}, {"en": "Stop & Hold only on instruction", "ar": "الإيقاف والتثبيت عند التعليمات فقط"}, {"en": "Never push, never step into a dense crowd", "ar": "لا تدفعوا ولا تدخلوا حشدًا كثيفًا أبدًا"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف/مركز العمليات): 911 رقم الطوارئ الموحد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "conflict-1": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "THE MARSHAL'S LINE", "ar": null}, "steps": [{"en": "OBSERVE - CALM WITH WORDS - REPORT - ESCALATE", "ar": null}, {"en": "NEVER touch, hold, block or remove anyone", "ar": null}, {"en": "Don't say: 'Calm down!' | 'Rules are rules' | 'Not my problem'", "ar": null}, {"en": "Say: 'I can see you're upset' | 'Let me find out' | 'This way, please'", "ar": null}]}, "conflict-2": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "AMBER AND RED - THE SIGNS", "ar": null}, "steps": [{"en": "Frustration -> Anger -> Aggression -> Violence", "ar": null}, {"en": "AMBER (warning): Raised voice, Pointing, Red face, Staring, Moving closer, Big arm movements, Swearing. Slow down, listen, keep your space, tell your supervisor.", "ar": null}, {"en": "RED (danger): Face goes pale, Fists clench, Hands come up above the waist, Shoulders tense, Quick glances at a target or exit, Body drops lower, Goes suddenly quiet. Step back NOW, get distance, call Security.", "ar": null}]}, "conflict-3": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "STAY SAFE", "ar": null}, "steps": [{"en": "Side-on, hands open, 1-3 m", "ar": null}, {"en": "Keep a way out; never corner anyone", "ar": null}, {"en": "Work in pairs: contact and cover", "ar": null}, {"en": "Before you go: TACT (Think - Assess - Consider - Take the safest action) + SEW", "ar": null}, {"en": "NEVER touch, hold, block or remove anyone", "ar": null}]}, "conflict-4": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "CALM IT", "ar": null}, "steps": [{"en": "L - Listen: let them speak; nod", "ar": null}, {"en": "E - Empathise: 'I understand …'", "ar": null}, {"en": "A - Ask: helpful questions", "ar": null}, {"en": "P - Propose: give options", "ar": null}, {"en": "Say: 'I can see you're upset' | 'Let me find out' | 'This way, please'", "ar": null}, {"en": "Don't say: 'Calm down!' | 'Rules are rules' | 'Not my problem'", "ar": null}]}, "conflict-5": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "GROUND RULES", "ar": null}, "steps": [{"en": "Ground rules: explain - ask - report. Never take items.", "ar": null}, {"en": "Flare? Don't touch - report; lit = Incident White.", "ar": null}, {"en": "Seat dispute: greet both sides - check both tickets - show the right seats - still stuck? Call your supervisor", "ar": null}]}, "conflict-6": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "WALK AWAY - AND AFTERWARDS", "ar": null}, "steps": [{"en": "Stuck? Exit line - pass it on", "ar": null}, {"en": "Radio: 'Disturbance' or 'Security Assistance' + WHERE - WHAT - WHO - WHAT I'M DOING", "ar": null}, {"en": "Afterwards: incident card; water; talk to your supervisor", "ar": null}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": null}]}, "lost-1": {"drawer": "lost", "code": "SMP 9.3", "released": true, "source": "smp93-safeguarding-lost-persons/release/v6", "title": {"en": "SAFEGUARDING", "ar": "الحماية"}, "steps": [{"en": "RECOGNISE - DON'T INVESTIGATE - REPORT", "ar": "لاحظ - لا تحقق بنفسك - بلغ"}, {"en": "Danger now? Nearest Security / police, then report.", "ar": "خطر الآن؟ أقرب فرد من الامن / الشرطة، ثم بلغوا."}, {"en": "Woman or girl? Ask a female colleague to help.", "ar": "امرأة أو فتاة؟ اطلبوا من زميلة أن تساعد."}]}, "lost-2": {"drawer": "lost", "code": "SMP 9.3", "released": true, "source": "smp93-safeguarding-lost-persons/release/v6", "title": {"en": "SOMEONE IS LOST", "ar": "شخص مفقود"}, "steps": [{"en": "1 Calm the person reporting", "ar": "1 هدّئوا الشخص المُبلِّغ"}, {"en": "2 Describe: age, boy/girl, height, hair, clothes, name - where and when last seen", "ar": "2 صِفوا: العمر، ولد/بنت، الطول، الشعر، الملابس، الاسم - وأين ومتى شوهد آخر مرة"}, {"en": "3 Look around your area (stay at post)", "ar": "3 انظروا حول منطقتكم (ابقوا في موقعكم)"}, {"en": "4 Call your supervisor", "ar": "4 اتصلوا بالمشرف"}, {"en": "Note the reporter's name and seat number; ask them to stay until your supervisor arrives", "ar": "سجّلوا اسم المُبلِّغ ورقم مقعده؛ واطلبوا منه البقاء حتى يصل المشرف"}, {"en": "-> Supervisor takes over: same place, 15 minutes, wait for instructions", "ar": "-> المشرف يتولى الأمر: المكان نفسه، 15 دقيقة، انتظار التعليمات"}]}, "lost-3": {"drawer": "lost", "code": "SMP 9.3", "released": true, "source": "smp93-safeguarding-lost-persons/release/v6", "title": {"en": "SOMEONE IS FOUND", "ar": "شخص تم العثور عليه"}, "steps": [{"en": "1 Introduce yourself - 'I work for   '<div class="rv-head"><h2 id="rvTitle">Review comments</h2><button type="button" class="rv-x" id="rvClose" aria-label="Close">✕</button></div>'+
  '<p class="rv-where" id="rvWhere"></p>'+
  '<ul class="rv-list" id="rvList"></ul>'+
  '<label class="rv-l" for="rvBy">Your name</label><input class="rv-in" id="rvBy" type="text" autocomplete="name">'+
  '<label class="rv-l" for="rvKind">What is it about?</label><select class="rv-in" id="rvKind">'+KINDS.map(function(k){return '<option>'+k+'</option>';}).join('')+'</select>'+
  '<label class="rv-l" for="rvText">Your comment on this screen</label><textarea class="rv-in" id="rvText" rows="4"></textarea>'+
  '<div class="rv-row"><button type="button" class="rv-b rv-save" id="rvSave">Save comment</button><span class="rv-msg" id="rvMsg" role="status"></span></div>'+
  '<div class="rv-foot"><p id="rvAll"></p><p class="rv-hint" id="rvHint"></p>'+
  '<div class="rv-row"><button type="button" class="rv-b" id="rvDown">Download all comments</button>'+(SHARED?'':'<button type="button" class="rv-b rv-quiet" id="rvClear">Delete all</button>')+'</div></div>'+
  '</div>');
document.body.appendChild(tab);document.body.appendChild(tip);document.body.appendChild(pn);
/* keep the button clear of the course: above the sticky button bar on a phone; the tip sits just above the button */
function pinned(e){   /* inside a bar that stays put on screen (sticky / fixed), not content that scrolls past */
  for(var n=e;n&&n.id!=='stage';n=n.parentElement){var p=getComputedStyle(n).position;if(p==='sticky'||p==='fixed')return true;}return false;}
function place(){   /* keep clear of the course: rise above the fixed bars (sticky Next bar, side lesson list) and, by a little, above
                       buttons near the bottom; use the bottom corner that is freest (the reading-start corner on a tie) */
  var w=tab.offsetWidth,h=tab.offsetHeight,start=getComputedStyle(document.documentElement).direction==='rtl'?'right':'left';
  var els=[].slice.call(document.querySelectorAll('#main button,#main a,#main input,#main select,#main [role=button]'))
    .map(function(e){var r=e.getBoundingClientRect();return {r:r,pin:pinned(e)};}).filter(function(x){return x.r.width&&x.r.height;});
  function fit(side){var left=side==='left'?16:innerWidth-16-w,bottom=16,hit=0;
    for(var pass=0;pass<8;pass++){var top=innerHeight-bottom-h,moved=false;
      els.forEach(function(x){var r=x.r;if(r.right>left&&r.left<left+w&&r.bottom>top&&r.top<top+h){var nb=innerHeight-r.top+10;
        if(x.pin||nb<=160){bottom=Math.max(bottom,nb);moved=true;}}});
      if(!moved)break;}
    bottom=Math.min(bottom,innerHeight*0.5);var top2=innerHeight-bottom-h;   /* what still lies under it: a fixed bar counts more (it cannot be scrolled away) */
    els.forEach(function(x){var r=x.r;if(r.right>left&&r.left<left+w&&r.bottom>top2&&r.top<top2+h)hit+=x.pin?10:1;});
    return {side:side,bottom:bottom,hit:hit};}
  var a=fit(start),b=fit(start==='left'?'right':'left');
  var best=(b.hit<a.hit||(b.hit===a.hit&&b.bottom<a.bottom))?b:a;
  tab.style.left=tip.style.left=best.side==='left'?'16px':'auto';tab.style.right=tip.style.right=best.side==='right'?'16px':'auto';
  tab.style.bottom=best.bottom+'px';tip.style.bottom=(best.bottom+h+10)+'px';}
window.addEventListener('resize',place);window.addEventListener('scroll',place,{passive:true});
var TIPKEY='ck-review-tip-seen';try{if(!localStorage.getItem(TIPKEY)){tip.hidden=false;setTimeout(function(){tip.hidden=true;},9000);}}catch(e){}
function tipDone(){tip.hidden=true;try{localStorage.setItem(TIPKEY,'1');}catch(e){}}
tip.addEventListener('click',function(){tipDone();open_();});
var by=g('rvBy');try{by.value=localStorage.getItem(NAME)||'';}catch(e){}
function onScreen(id){return all().filter(function(c){return c.screen===id;}).sort(function(a,b){return a.saved_at<b.saved_at?-1:1;});}
function refresh(){
  var w=here(),m=onScreen(w.id);
  g('rvN').textContent=m.length?String(m.length):'';place();
  tab.setAttribute('aria-label','Review comments'+(m.length?' ('+m.length+' on this screen)':''));
  if(pn.hidden)return;
  g('rvWhere').innerHTML='Screen <b>'+esc(w.id||'start')+'</b>'+(w.head?' · '+esc(w.head):'')+' <span>('+w.n+' of '+w.of+')</span>';
  g('rvList').innerHTML=m.map(function(c){var ok=sent(c);return '<li'+(ok?'':' class="rv-wait"')+'><span class="rv-k">'+esc(c.kind)+'</span> '+esc(c.comment)+
    '<small>'+esc(c.reviewer||'Reviewer')+' · '+esc(String(c.saved_at||'').slice(0,10))+(c.language?' · '+esc(c.language):'')+(ok?'':' · <b>Not sent yet</b>')+'</small>'+
    (ok&&SHARED?'':'<button type="button" class="rv-del" data-id="'+esc(c.id)+'">Delete</button>')+'</li>';}).join('');
  var n=all().length;
  g('rvAll').textContent=SHARED?(n===1?'1 open comment on this course.':n+' open comments on this course.'):(n===1?'1 comment saved in this course.':n+' comments saved in this course.');
  g('rvHint').textContent=SHARED?(net==='down'?'Cannot reach the comment sheet. Your comments are kept here and sent when the connection is back.':
      'Everyone reviewing this course sees these comments. The course team removes a comment when it is fixed.'):
    (mem?'This browser cannot keep comments. Download them before you close the page.':
      'Comments stay in this browser. When you finish, tap "Download all comments" and send the file back.');
  g('rvDown').disabled=!n;if(g('rvClear'))g('rvClear').disabled=!n;
}
/* ---- the shared sheet: read open comments, send waiting ones (plain-text POST: no login, no preflight) ---- */
function load(force){
  if(!SHARED||(!force&&Date.now()-lastLoad<15000))return;lastLoad=Date.now();
  fetch(URL_+(URL_.indexOf('?')<0?'?':'&')+'course='+encodeURIComponent(COURSE.id)+'&t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json();}).then(function(d){if(!d||!d.ok)throw 0;remote=d.comments||[];net='up';
      mine=mine.filter(function(c){return !remote.some(function(r){return r.id===c.id;});});store();refresh();})
    .catch(function(){net='down';refresh();});
}
function send(){
  if(!SHARED||sending||!mine.length)return;sending=true;
  var c=mine[0];
  fetch(URL_,{method:'POST',body:JSON.stringify({action:'add',comment:c})}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)throw 0;net='up';remote.push(c);mine=mine.filter(function(x){return x.id!==c.id;});store();sending=false;refresh();send();
  }).catch(function(){sending=false;net='down';refresh();});
}
function open_(){pn.hidden=false;tab.setAttribute('aria-expanded','true');g('rvMsg').textContent='';refresh();load();send();g('rvText').focus();}
function close_(){pn.hidden=true;tab.setAttribute('aria-expanded','false');tab.focus();}
tab.addEventListener('click',function(){tipDone();if(pn.hidden)open_();else close_();});
g('rvClose').addEventListener('click',close_);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pn.hidden)close_();});
g('rvSave').addEventListener('click',function(){
  var t=g('rvText').value.trim();if(!t){g('rvMsg').textContent='Type a comment first.';g('rvText').focus();return;}
  var w=here(),name=by.value.trim();try{localStorage.setItem(NAME,name);}catch(e){}
  mine.push({id:uid(),course:COURSE.id,screen:w.id,screen_no:w.n,lesson:w.sec,screen_type:w.type,heading:w.head,
    language:(typeof LANG!=='undefined'?LANG:''),kind:g('rvKind').value,comment:t,reviewer:name,saved_at:new Date().toISOString()});
  store();g('rvText').value='';g('rvMsg').textContent='Saved.';refresh();send();
});
g('rvList').addEventListener('click',function(e){var b=e.target.closest('.rv-del');if(!b)return;   /* only this browser's own, not-yet-sent comments */
  mine=mine.filter(function(c){return c.id!==b.getAttribute('data-id');});store();refresh();});
function csv(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
g('rvDown').addEventListener('click',function(){
  var cols=['course','screen','screen_no','lesson','screen_type','heading','language','kind','comment','reviewer','saved_at','id'];
  var rows=all().sort(function(a,b){return (a.screen_no-b.screen_no)||(a.saved_at<b.saved_at?-1:1);}).map(function(c){
    return cols.map(function(k){return csv(k==='course'?COURSE.id:c[k]);}).join(',');});
  var blob=new Blob([BOM+cols.join(',')+'\r\n'+rows.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'});
  var who=(by.value.trim()||'reviewer').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'reviewer';
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=COURSE.id+'-review-'+who+'.csv';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
});
if(g('rvClear'))g('rvClear').addEventListener('click',function(){
  if(!mine.length||!window.confirm('Delete all '+mine.length+' comments in this course? Download them first if you have not sent them.'))return;
  mine=[];store();refresh();
});
var _render=render;
render=function(i){_render(i);refresh();setTimeout(place,250);};
if(SHARED){load(true);send();setInterval(function(){if(!document.hidden){load();send();}},60000);window.addEventListener('online',function(){load(true);send();});}
window.addEventListener('beforeunload',function(e){if((mem||SHARED)&&mine.length&&(mem||net==='down')){e.preventDefault();e.returnValue='';}});
})();

window.addEventListener("hashchange",function(){sync();render(cur);});
document.addEventListener("click",function(e){if(e.target.closest(".lang"))setTimeout(function(){sync();render(cur);},50);});
render(cur);
})();
</script>
</body>
</html>
