 "998 Civil Defence", "ar": "998 الدفاع المدني"}, {"en": "997 Red Crescent ambulance", "ar": "997 إسعاف الهلال الأحمر"}, {"en": "Only if you cannot reach your supervisor / VOC.", "ar": "فقط إذا لم تتمكن من الوصول إلى مشرفك / مركز عمليات الملعب."}]}, "role-1": {"drawer": "role", "code": "SMP 2.1", "released": true, "source": "smp21-role-authority/release/v4", "title": {"en": "NOT MY ROLE - NEVER", "ar": "ليس من دوري - أبدًا"}, "steps": [{"en": "✖ Touch, push, pull, hold or restrain anyone", "ar": "✖ لمس أي شخص أو دفعه أو سحبه أو إمساكه أو تقييده"}, {"en": "✖ Search a person or a bag", "ar": "✖ تفتيش شخص أو حقيبة"}, {"en": "✖ Take (confiscate) property", "ar": "✖ أخذ (مصادرة) الممتلكات"}, {"en": "✖ Eject or remove anyone", "ar": "✖ إخراج أي شخص أو إبعاده"}, {"en": "✖ Hold anyone 'until the police come' or block a doorway", "ar": "✖ إمساك أي شخص 'حتى تأتي الشرطة' أو سدّ المدخل"}, {"en": "Aggressive person? Step back - keep your distance - report. Never get physical.", "ar": "شخص عدواني؟ تراجع - وحافظ على مسافتك - وأبلغ. ولا تتدخّل جسديًا أبدًا."}]}, "role-2": {"drawer": "role", "code": "SMP 2.1", "released": true, "source": "smp21-role-authority/release/v4", "title": {"en": "Who leads?", "ar": "من يتولى القيادة؟"}, "steps": [{"en": "Venue Security (SEC) - screening, access, refused entry", "ar": "أمن الملعب (SEC) - الفحص الأمني، والدخول، ومنع الدخول"}, {"en": "Police - violence, crime, suspicious items, removal", "ar": "الشرطة - العنف، والجرائم، والأغراض المشبوهة، والإخراج"}, {"en": "Saudi Civil Defence - fire and evacuation", "ar": "الدفاع المدني السعودي - الحرائق والإخلاء"}, {"en": "Saudi Red Crescent / medical - illness and injury", "ar": "الهلال الأحمر السعودي / الفرق الطبية - المرض والإصابات"}, {"en": "VOC - all agencies, big decisions", "ar": "مركز عمليات الملعب - جميع الجهات، والقرارات الكبرى"}, {"en": "In an emergency: follow Civil Defence / Police / Security, then tell your supervisor", "ar": "في حالات الطوارئ: اتبع تعليمات الدفاع المدني / الشرطة / الأمن، ثم أخبر مشرفك"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا لم تتمكّن من الوصول إلى مشرفك/مركز عمليات الملعب): 911 الرقم الموحّد للطوارئ | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "role-3": {"drawer": "role", "code": "SMP 2.1", "released": true, "source": "smp21-role-authority/release/v4", "title": {"en": "My chain", "ar": "تسلسلي القيادي"}, "steps": [{"en": "Supervisor: {field:supervisor} - first call, every time", "ar": "المشرف: {field:supervisor} - أول من تتصل به، في كل مرة"}, {"en": "Area Leader: {field:areaLeader} - no answer or getting worse", "ar": "قائد المنطقة: {field:areaLeader} - إذا لم يكن هناك رد أو كان الوضع يزداد سوءًا"}, {"en": "Channel: {field:channel}", "ar": "القناة: {field:channel}"}, {"en": "FNP Venue Manager / Deputy → VOC", "ar": "مدير عمليات الجماهير في الملعب / نائبه ← مركز عمليات الملعب"}, {"en": "Head of Marshals - attendance, food, water, uniform, equipment", "ar": "رئيس المنظمين - الحضور، والطعام، والماء، والزي، والمعدات"}]}, "role-4": {"drawer": "role", "code": "SMP 2.1", "released": true, "source": "smp21-role-authority/release/v4", "title": {"en": "Radio and team habits", "ar": "اللاسلكي وعادات الفريق"}, "steps": [{"en": "✖ Open emergency gates or start Stop & Go unless instructed through your chain", "ar": "✖ فتح بوابات الطوارئ أو بدء الإيقاف والتحرّك دون تعليمات عبر تسلسلك القيادي"}, {"en": "Radio: CALL SIGN → WHERE → WHAT → WHO → WHAT I'M DOING → OVER", "ar": "اللاسلكي: رمز النداء ← أين ← ماذا ← من ← ماذا أفعل ← حوّل"}, {"en": "Team habits: Brief - Confirm - Stay - Support - Speak up", "ar": "عادات الفريق: الإحاطة - التأكيد - البقاء - الدعم - التحدّث"}]}, "role-5": {"drawer": "role", "code": "SMP 2.1", "released": true, "source": "smp21-role-authority/release/v4", "title": {"en": "MY ROLE - DO", "ar": "دوري - ما أفعله"}, "steps": [{"en": "SAFETY FIRST: watch crowd build-up - report early", "ar": "السلامة أولًا: راقب تزايد الحشود - وأبلغ مبكرًا"}, {"en": "SERVICE ALWAYS: Host - Direct - Inform - Assist - Support", "ar": "الخدمة دائمًا: الاستقبال - التوجيه - الإعلام - المساعدة - الدعم"}, {"en": "Keep exits, gangways and emergency routes clear", "ar": "أبقِ المخارج والممرات ومسارات الطوارئ خالية"}, {"en": "Observe - report - escalate", "ar": "راقب - أبلغ - صعّد"}, {"en": "Redirect fans to the right gate, route or service", "ar": "أعِد توجيه المشجعين إلى البوابة أو المسار أو الخدمة الصحيحة"}, {"en": "Move yourself and others away from danger", "ar": "ابتعد أنت والآخرون عن الخطر"}, {"en": "Follow briefings and instructions from your chain", "ar": "اتبع الإحاطات والتعليمات التي تأتيك عبر تسلسلك القيادي"}]}, "duty-1": {"drawer": "duty", "code": "SMP 2.2", "released": true, "source": "smp22-match-day-duties-posts/release/v6", "title": {"en": "Ready - the night before", "ar": "الجاهزية - في الليلة السابقة"}, "steps": [{"en": "Uniform clean, complete and unaltered - nothing partisan", "ar": "الزي الرسمي نظيف وكامل وغير معدَّل - لا شيء يدل على تشجيع فريق"}, {"en": "Hi-vis / tabard packed", "ar": "السترة العاكسة في الحقيبة"}, {"en": "Accreditation in your bag - then round your neck", "ar": "بطاقة تصريح الدخول في حقيبتكم - ثم حول رقبتكم"}, {"en": "Joining instructions, check-in time and journey planned", "ar": "تعليمات الالتحاق وموعد تسجيل الحضور والرحلة مخطط لها"}]}, "duty-2": {"drawer": "duty", "code": "SMP 2.2", "released": true, "source": "smp22-match-day-duties-posts/release/v6", "title": {"en": "Ready - at check-in", "ar": "الجاهزية - عند تسجيل الحضور"}, "steps": [{"en": "Sign in on arrival", "ar": "سجلوا حضوركم عند الوصول"}, {"en": "Collect kit: radio, earpiece, friendly map, Incident Report Forms and any kit for your post", "ar": "استلموا المعدات: جهاز اللاسلكي، سماعة الأذن، الخريطة الإرشادية، نماذج الإبلاغ عن الحوادث وأي معدات لنقطتكم"}, {"en": "Radio check: 'loud and clear'", "ar": "فحص اللاسلكي: «واضح ومسموع»"}, {"en": "At the briefing, write down: post | supervisor & call sign | code words | break/prayer slot", "ar": "في الإحاطة، دوّنوا: نقطة التمركز | المشرف ورمز النداء | الكلمات الرمزية | موعد الاستراحة/الصلاة"}]}, "duty-3": {"drawer": "duty", "code": "SMP 2.2", "released": true, "source": "smp22-match-day-duties-posts/release/v6", "title": {"en": "On post - from 2 hours before kick-off", "ar": "في نقطة التمركز - قبل ساعتين من انطلاق المباراة"}, "steps": [{"en": "Hi-vis on top, accreditation visible", "ar": "السترة العاكسة فوق كل شيء، وبطاقة تصريح الدخول ظاهرة"}, {"en": "Area check: exits, obstructions, signage - report problems", "ar": "فحص المنطقة: المخارج والعوائق واللافتات - أبلغوا عن المشكلات"}, {"en": "Face the crowd, not the match", "ar": "واجهوا الحشود، لا المباراة"}, {"en": "Keep exits and emergency routes clear", "ar": "أبقوا المخارج ومسارات الطوارئ خالية"}, {"en": "No eating, drinking or smoking in public view; no private calls", "ar": "ممنوع الأكل والشرب والتدخين أمام الجمهور؛ ولا مكالمات خاصة"}, {"en": "Ask before leaving your post", "ar": "استأذنوا قبل مغادرة نقطة التمركز"}, {"en": "Know your pressure peak: gates open / half-time / final whistle", "ar": "اعرفوا ذروة الضغط: فتح البوابات / بين الشوطين / صافرة النهاية"}]}, "duty-4": {"drawer": "duty", "code": "SMP 2.2", "released": true, "source": "smp22-match-day-duties-posts/release/v6", "title": {"en": "Stay and hand back", "ar": "البقاء والتسليم"}, "steps": [{"en": "Move to your egress position when called (second half)", "ar": "انتقلوا إلى موقع الخروج عند النداء (الشوط الثاني)"}, {"en": "Stay on post until stood down", "ar": "ابقوا في نقطة التمركز حتى تُنهى مناوبتكم"}, {"en": "Debrief - hand in Incident Report Forms", "ar": "استخلاص الدروس - سلّموا نماذج الإبلاغ عن الحوادث"}, {"en": "Return radio, earpiece, tabard and kit", "ar": "أعيدوا جهاز اللاسلكي وسماعة الأذن والسترة العاكسة والمعدات"}, {"en": "Report lost or faulty items", "ar": "أبلغوا عن المعدات المفقودة أو المعطّلة"}, {"en": "Sign out", "ar": "تسجيل الانصراف"}]}, "duty-5": {"drawer": "duty", "code": "SMP 2.2", "released": true, "source": "smp22-match-day-duties-posts/release/v6", "title": {"en": "Remember", "ar": "تذكّروا"}, "steps": [{"en": "Lost your accreditation? Tell your supervisor straight away.", "ar": "فقدتم بطاقة تصريح الدخول؟ أخبروا مشرفكم فوراً."}, {"en": "Kit faulty? Tell whoever issued it - before you deploy.", "ar": "المعدات معطّلة؟ أخبروا من سلّمها لكم - قبل الانتقال إلى منطقتكم."}, {"en": "Marshals cannot search anyone and cannot eject anyone.", "ar": "لا يحق للمنظِّمين تفتيش أي شخص ولا طرده."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا لم تتمكنوا من الوصول إلى مشرفكم/مركز عمليات الملعب): 911 الرقم الموحد للطوارئ | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "conduct-1": {"drawer": "conduct", "code": "SMP 2.3", "released": true, "source": "smp23-code-of-conduct-practice/release/v7", "title": {"en": "On duty - Do", "ar": "أثناء العمل - افعلوا"}, "steps": [{"en": "Personal phone away on post - radio is your tool", "ar": "أبعدوا هواتفكم الشخصية أثناء وجودكم في الموقع؛ فجهاز اللاسلكي هو أداة عملكم."}, {"en": "Face the crowd, stay neutral", "ar": "واجهوا الحشود والتزموا الحياد."}, {"en": "Take a fan's photo on THEIR phone if asked and your post is quiet", "ar": "إذا طُلب منكم ذلك وكان موقعكم هادئًا، التقطوا صورة للمشجع باستخدام هاتفه هو."}, {"en": "Fans' details: only what the task needs, on the form, to the right team", "ar": "اجمعوا من بيانات المشجعين ما تتطلبه المهمة فقط، وسجّلوه في النموذج، ثم أرسلوه إلى الفريق المعني."}, {"en": "Journalists: 'Please speak to the media team'", "ar": "لِلصحفيين: «يُرجى التحدث إلى الفريق الإعلامي»."}, {"en": "Refuse gifts and tips politely", "ar": "ارفضوا الهدايا والإكراميات بلطف."}, {"en": "Own your mistakes; report breaches to your supervisor", "ar": "تحمّلوا مسؤولية أخطائكم، وأبلغوا مشرفكم عن أي مخالفة."}]}, "conduct-2": {"drawer": "conduct", "code": "SMP 2.3", "released": true, "source": "smp23-code-of-conduct-practice/release/v7", "title": {"en": "Saw a breach?", "ar": "هل شاهدتم مخالفة؟"}, "steps": [{"en": "Don't join in", "ar": "لا تشاركوا فيها."}, {"en": "Ask for it to stop / delete", "ar": "اطلبوا إيقافها أو حذفها."}, {"en": "Tell your supervisor", "ar": "أبلغوا مشرفكم."}, {"en": "Silence is also a breach", "ar": "الصمت يُعدّ مخالفة أيضًا."}]}, "conduct-3": {"drawer": "conduct", "code": "SMP 2.3", "released": true, "source": "smp23-code-of-conduct-practice/release/v7", "title": {"en": "On duty - Don't", "ar": "أثناء العمل - لا تفعلوا"}, "steps": [{"en": "Photograph or film fans, incidents, children or colleagues", "ar": "لا تصوّروا المشجعين أو الحوادث أو الأطفال أو الزملاء، بالصور أو الفيديو"}, {"en": "Photograph Security, police, Civil Defence or security areas", "ar": "لا تصوّروا الأمن أو الشرطة أو الدفاع المدني أو المناطق الأمنية"}, {"en": "Post about fans, incidents or operations - during or after the shift", "ar": "لا تنشروا عن المشجعين أو الحوادث أو العمليات، أثناء المناوبة أو بعدها"}, {"en": "Share Dot Plans, radio sheets or code words", "ar": "لا تشاركوا خطط التوزيع أو أوراق اللاسلكي أو الكلمات الرمزية"}, {"en": "Bet on matches or share inside information", "ar": "لا تراهنوا على المباريات ولا تشاركوا معلومات داخلية"}, {"en": "Cheer, wear team colours or make political comments", "ar": "لا تشجّعوا، ولا ترتدوا ألوان فريق، ولا تدلوا بتعليقات سياسية"}, {"en": "Keep, copy or share anyone's personal details", "ar": "لا تحتفظوا بالبيانات الشخصية لأي شخص ولا تنسخوها ولا تشاركوها"}]}, "conduct-4": {"drawer": "conduct", "code": "SMP 2.3", "released": true, "source": "smp23-code-of-conduct-practice/release/v7", "title": {"en": "Complaint?", "ar": "شكوى؟"}, "steps": [{"en": "Listen", "ar": "استمعوا"}, {"en": "Apologise for their experience", "ar": "اعتذروا عن تجربتهم"}, {"en": "Help now", "ar": "ساعدوا الآن"}, {"en": "Info Point for feedback", "ar": "نقطة المعلومات للملاحظات"}, {"en": "Tell your supervisor", "ar": "أبلغوا مشرفكم."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذّر عليكم الوصول إلى المشرف/مركز عمليات الملعب (VOC)): 911 رقم الطوارئ الموحّد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "venue-1": {"drawer": "venue", "code": "SMP 3.1", "released": true, "source": "smp31-spectator-journey-venue/release/v4", "title": {"en": "The fan journey - and my job", "ar": "رحلة المشجّع — ودوري"}, "steps": [{"en": "Travel (metro, bus, park-and-ride) → Last Mile: welcome, directions, crossings", "ar": "التنقّل (المترو، والحافلة، ومواقف «اركن وانتقل») ← الميل الأخير: الترحيب بالمشجّعين، وإرشادهم، وتنظيم عبورهم للطريق"}, {"en": "→ Security check point (PSA): prepare fans - Security search", "ar": "← نقطة التفتيش الأمنية (PSA): تهيئة المشجّعين للتفتيش — يتولى أفراد الأمن التفتيش"}, {"en": "→ Gate & turnstiles: scan, redirect wrong gate", "ar": "← البوابة والبوابات الدوّارة: مسح التذاكر، وتوجيه المشجّعين الموجودين عند البوابة الخطأ"}, {"en": "→ Concourse: directions, routes clear", "ar": "← الردهة: تقديم الإرشادات، وإبقاء المسارات مفتوحة"}, {"en": "→ Seat: block - row - seat, gangways clear", "ar": "← المقعد: المدرّج — الصف — المقعد، وإبقاء الممرات خالية"}, {"en": "→ Departure: egress position, safe journey home", "ar": "← المغادرة: التمركز في موقع تنظيم الخروج، ومساعدة المشجّعين على العودة إلى منازلهم بأمان"}]}, "venue-2": {"drawer": "venue", "code": "SMP 3.1", "released": true, "source": "smp31-spectator-journey-venue/release/v4", "title": {"en": "Find these first", "ar": "اعرفوا مواقع هذه أولًا"}, "steps": [{"en": "Exits - first aid - assembly point: find all three before the gates open.", "ar": "المخارج — الإسعافات الأولية — نقطة التجمع: حدّدوا مواقعها الثلاثة قبل فتح البوابات."}, {"en": "Green sign = exit, assembly point. Red crescent = first aid. Red sign = fire equipment.", "ar": "اللافتة الخضراء تعني: مخرج، أو نقطة تجمع. الهلال الأحمر يعني: إسعافات أولية. اللافتة الحمراء تعني: معدات إطفاء الحريق."}, {"en": "Emergency routes and emergency vehicle routes stay clear all the time.", "ar": "أبقوا مسارات الطوارئ ومسارات مركبات الطوارئ خالية دائمًا."}, {"en": "Nearest food kiosk / toilets: ________", "ar": "أقرب كشك طعام / دورات مياه: __________"}, {"en": "My vomitory serves blocks: ________", "ar": "الأقسام التي يخدمها ممر الدخول إلى المدرّجات الخاص بي: __________"}]}, "venue-3": {"drawer": "venue", "code": "SMP 3.1", "released": true, "source": "smp31-spectator-journey-venue/release/v4", "title": {"en": "Look - point - say it", "ar": "انظروا - أشيروا - قولوها"}, "steps": [{"en": "Nearest exit", "ar": "أقرب مخرج"}, {"en": "First aid", "ar": "الإسعافات الأولية"}, {"en": "Assembly point", "ar": "نقطة التجمع"}, {"en": "Emergency vehicle route - keep it clear", "ar": "مسار مركبات الطوارئ - أبقوه خالياً"}]}, "venue-4": {"drawer": "venue", "code": "SMP 3.1", "released": true, "source": "smp31-spectator-journey-venue/release/v4", "title": {"en": "Fans never go", "ar": "لا يدخل المشجعون أبداً"}, "steps": [{"en": "Fans never go: back-of-house, mixed zone, field of play.", "ar": "لا يدخل المشجعون أبداً: المناطق الخلفية، والمنطقة المختلطة، وأرض الملعب."}, {"en": "Say no kindly - tell your supervisor.", "ar": "قولوا لا بلطف - وأخبروا المشرف."}]}, "venue-5": {"drawer": "venue", "code": "SMP 3.1", "released": true, "source": "smp31-spectator-journey-venue/release/v4", "title": {"en": "My post - fill in at briefing", "ar": "موقعي - يُملأ في الإحاطة"}, "steps": [{"en": "My stadium: ________", "ar": "ملعبي: ________"}, {"en": "Ingress dot: ____ · Egress dot: ____", "ar": "موقعي عند الدخول: ____ · موقعي عند الخروج: ____"}, {"en": "Nearest exit: ________", "ar": "أقرب مخرج: ________"}, {"en": "First aid post: ________", "ar": "نقطة الإسعافات الأولية: ________"}, {"en": "Assembly point: ________", "ar": "نقطة التجمع: ________"}, {"en": "Emergency vehicle route: ________", "ar": "مسار مركبات الطوارئ: ________"}, {"en": "Info Point / prayer room: ________", "ar": "نقطة المعلومات / المصلى: ________"}]}, "venue-6": {"drawer": "venue", "code": "SMP 3.1", "released": true, "source": "smp31-spectator-journey-venue/release/v4", "title": {"en": "Know My Venue", "ar": "اعرف ملعبي"}, "steps": [{"en": "Supervisor call sign: ____", "ar": "رمز نداء المشرف: ____"}, {"en": "Green sign = exit, assembly point. Red crescent = first aid. Red sign = fire equipment.", "ar": "اللافتة الخضراء تعني: مخرج، أو نقطة تجمع. الهلال الأحمر يعني: إسعافات أولية. اللافتة الحمراء تعني: معدات إطفاء الحريق."}, {"en": "Fans never go: back-of-house, mixed zone, field of play. Say no kindly - tell your supervisor.", "ar": "لا يدخل المشجعون أبداً: المناطق الخلفية، والمنطقة المختلطة، وأرض الملعب. قولوا لا بلطف - وأخبروا المشرف."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إن تعذّر الوصول إلى مشرفكم/مركز عمليات الملعب (VOC)): 911 رقم الطوارئ الموحّد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "ways-1": {"drawer": "ways", "code": "SMP 3.2", "released": true, "source": "smp32-customer-service-wayfinding/release/v5", "title": {"en": "Don't know? Never guess", "ar": "لا تعرفون؟ لا تخمّنوا أبدًا."}, "steps": [{"en": "Say 'One moment'.", "ar": "قولوا: «لحظة من فضلك»."}, {"en": "Check the map or your briefing.", "ar": "تحقّقوا من الخريطة أو من الإحاطة."}, {"en": "Ask your supervisor.", "ar": "اسألوا مشرفكم."}, {"en": "Send them to the Info Point.", "ar": "وجّهوهم إلى نقطة المعلومات."}]}, "ways-2": {"drawer": "ways", "code": "SMP 3.2", "released": true, "source": "smp32-customer-service-wayfinding/release/v5", "title": {"en": "Read the ticket", "ar": "اقرؤوا التذكرة"}, "steps": [{"en": "1 Gate (first!)", "ar": "1 البوابة (أولًا!)"}, {"en": "2 Block / section - sign at the vomitory", "ar": "2 المبنى / القطاع - اللافتة عند ممر الدخول إلى المدرّجات"}, {"en": "3 Row", "ar": "3 الصف"}, {"en": "4 Seat", "ar": "4 المقعد"}, {"en": "Also check: match and date; family / hospitality / accessible areas", "ar": "تحقّقوا أيضًا من: المباراة والتاريخ؛ ومناطق العائلات / الضيافة / المقاعد الميسّرة"}, {"en": "Route: gate → concourse → vomitory → row → seat", "ar": "الطريق: البوابة ← الردهة ← ممر الدخول إلى المدرّجات ← الصف ← المقعد"}, {"en": "Never send fans through emergency exits, closed gates or staff doors as a shortcut.", "ar": "لا ترسلوا المشجعين أبدًا عبر مخارج الطوارئ أو البوابات المغلقة أو أبواب الموظفين كطريق مختصر."}]}, "ways-3": {"drawer": "ways", "code": "SMP 3.2", "released": true, "source": "smp32-customer-service-wayfinding/release/v5", "title": {"en": "Give directions that work", "ar": "أعطوا توجيهات ناجحة"}, "steps": [{"en": "Find 'you are here'; turn the map to face your way", "ar": "حدّدوا «أنت هنا»؛ وأديروا الخريطة في اتجاهكم"}, {"en": "Stand beside the fan", "ar": "قفوا بجانب المشجع"}, {"en": "Open hand - not one finger", "ar": "يد مفتوحة - لا إصبع واحد"}, {"en": "Landmark + time ('past the kiosk, 3 minutes')", "ar": "معلم + وقت («بعد الكشك، 3 دقائق»)"}, {"en": "Max 3 steps, left/right from their side", "ar": "3 خطوات كحد أقصى، اليمين/اليسار من جهته"}, {"en": "Check: 'So - straight, then left?'", "ar": "تحقّقوا: «إذن - إلى الأمام، ثم يسارًا؟»"}, {"en": "Step-free route if needed", "ar": "المسار الخالي من الدرج عند الحاجة"}]}, "ways-4": {"drawer": "ways", "code": "SMP 3.2", "released": true, "source": "smp32-customer-service-wayfinding/release/v5", "title": {"en": "Wayfinding Pro", "ar": "خبير الإرشاد"}, "steps": [{"en": "Don't know? Never guess: say 'One moment' → check map/briefing → ask supervisor → Info Point.", "ar": "لا تعرفون؟ لا تخمّنوا أبدًا: قولوا «لحظة من فضلك» ← تحقّقوا من الخريطة/الإحاطة ← اسألوا المشرف ← نقطة المعلومات."}, {"en": "Never send fans through emergency exits, closed gates or staff doors as a shortcut.", "ar": "لا ترسلوا المشجعين أبدًا عبر مخارج الطوارئ أو البوابات المغلقة أو أبواب الموظفين كطريق مختصر."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إن تعذّر الوصول إلى مشرفكم/مركز عمليات الملعب (VOC)): 911 رقم الطوارئ الموحّد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "signals-1": {"drawer": "signals", "code": "SMP 4.1", "released": true, "source": "smp41-communicating-with-crowds/release/v7", "title": {"en": "Be seen", "ar": "احرصوا أن يراكم الجمهور"}, "steps": [{"en": "Be seen: safe spot, face the crowd, hands open, calm low voice.", "ar": "اختاروا مكانًا آمنًا، وواجهوا الجمهور، وأبقوا أيديكم مفتوحة، وتحدثوا بصوت هادئ ومنخفض."}]}, "signals-2": {"drawer": "signals", "code": "SMP 4.1", "released": true, "source": "smp41-communicating-with-crowds/release/v7", "title": {"en": "Three signals", "ar": "الإشارات الثلاث"}, "steps": [{"en": "STOP - one arm forward, open palm, hold - 'Stop here please'", "ar": "توقّفوا: مدّوا ذراعًا واحدة إلى الأمام، وافتحوا كفكم وأبقوها ثابتة. قولوا: «توقّفوا هنا من فضلكم»."}, {"en": "GO-MOVE - open-hand sweep towards the route - 'This way please'", "ar": "تحرّكوا: حرّكوا ذراعكم كاملة والكف مفتوحة باتجاه المسار. قولوا: «من هنا من فضلكم»."}, {"en": "HOLD - both palms forward, steady - ONLY on instruction - 'Please wait here'", "ar": "انتظروا: ارفعوا الذراعين مع توجيه الكفين إلى الأمام وأبقوهما ثابتتين. استخدموا هذه الإشارة بناءً على توجيه فقط. قولوا: «انتظروا هنا من فضلكم»."}, {"en": "Big - held - with your voice - same as your team. Never touch.", "ar": "اجعلوا الإشارات كبيرة وواضحة، وأبقوها ثابتة، واستخدموا صوتكم معها، والتزموا بإشارات فريقكم. لا تلمسوا أحدًا."}]}, "signals-3": {"drawer": "signals", "code": "SMP 4.1", "released": true, "source": "smp41-communicating-with-crowds/release/v7", "title": {"en": "Five-part announcement", "ar": "الإعلان من خمسة أجزاء"}, "steps": [{"en": "1 Attention - 'Attention please'", "ar": "1. لفت الانتباه: «انتباه من فضلكم»."}, {"en": "2 Who / where", "ar": "2. مَن المعنيون / أين."}, {"en": "3 What to do", "ar": "3. ما المطلوب منهم."}, {"en": "4 Why (short)", "ar": "4. السبب باختصار."}, {"en": "5 Thank and repeat", "ar": "5. الشكر، ثم تكرار التعليمات."}, {"en": "~30 s = twice, Arabic then English", "ar": "المدة نحو 30 ثانية: يُقال الإعلان مرتين، بالعربية أولًا ثم بالإنجليزية."}]}, "signals-4": {"drawer": "signals", "code": "SMP 4.1", "released": true, "source": "smp41-communicating-with-crowds/release/v7", "title": {"en": "Megaphone", "ar": "مكبّر الصوت"}, "steps": [{"en": "Megaphone: check battery, aim over heads, normal voice. PA first.", "ar": "مكبّر الصوت: البطارية، التوجيه فوق الرؤوس، صوت عادي. الإذاعة الداخلية أولاً."}, {"en": "Never guess on a megaphone. Emergency messages only when instructed.", "ar": "لا تخمّنوا أبداً في مكبّر الصوت. رسائل الطوارئ فقط عند صدور التعليمات."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف/مركز عمليات الملعب (VOC)): 911 رقم الطوارئ الموحّد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "psych-1": {"drawer": "psych", "code": "SMP 4.2", "released": true, "source": "smp42-crowd-psychology-football/release/v5", "title": {"en": "What changes a crowd", "ar": "ما الذي يغيّر أجواء الجمهور؟"}, "steps": [{"en": "Goals & celebrations - surges, climbing, flares", "ar": "الأهداف والاحتفالات — اندفاع المشجعين، والتسلق، والألعاب النارية"}, {"en": "Rivalry - chants, groups meeting", "ar": "التنافس — الهتافات والتقاء المجموعات"}, {"en": "Late goals & final whistle - sudden movement", "ar": "الأهداف المتأخرة وصافرة النهاية — حركة مفاجئة"}, {"en": "Pressure & heat - short tempers", "ar": "الضغط والحرّ — سرعة الانفعال"}, {"en": "Waiting with no information - frustration", "ar": "الانتظار من دون معلومات — الإحباط"}, {"en": "Rumours - spread by phones in minutes", "ar": "الشائعات — تنتشر عبر الهواتف خلال دقائق"}]}, "psych-2": {"drawer": "psych", "code": "SMP 4.2", "released": true, "source": "smp42-crowd-psychology-football/release/v5", "title": {"en": "Watch for change", "ar": "راقبوا التغيّر"}, "steps": [{"en": "Calm → Lively (normal) → Tense → Hostile / Distressed", "ar": "هادئة ← حماسية (طبيعي) ← متوترة ← عدائية / مضطربة"}, {"en": "Sudden noise or silence", "ar": "ضجيج أو صمت مفاجئ"}, {"en": "Heads turning to one spot", "ar": "رؤوس تلتفت إلى نقطة واحدة"}, {"en": "Groups forming / moving together", "ar": "مجموعات تتشكّل / تتحرك معًا"}, {"en": "Raised voices, pointing, pushing", "ar": "أصوات مرتفعة، وإشارة بالأيدي، ودفع"}, {"en": "People trying to get out", "ar": "أناس يحاولون الخروج"}]}, "psych-3": {"drawer": "psych", "code": "SMP 4.2", "released": true, "source": "smp42-crowd-psychology-football/release/v5", "title": {"en": "Report early", "ar": "بلّغوا مبكرًا"}, "steps": [{"en": "Call: 'Sierra 2, Sierra 2, this is Marshal 22, over.' Wait for 'Go ahead, over.'", "ar": "النداء: «سييرا 2، سييرا 2، هنا المنظم 22، حوّل.» انتظروا «تفضّل، حوّل.»"}, {"en": "Report early: CALL SIGN → WHERE → WHAT → WHO → WHAT I'M DOING → OVER.", "ar": "بلّغوا مبكرًا: رمز النداء ← أين ← ماذا ← من ← ماذا أفعل ← حوّل."}, {"en": "No physical intervention.", "ar": "لا تدخّل جسدي."}]}, "psych-4": {"drawer": "psych", "code": "SMP 4.2", "released": true, "source": "smp42-crowd-psychology-football/release/v5", "title": {"en": "Read the Crowd", "ar": "قراءة الحشد"}, "steps": [{"en": "Your response: stay calm, stay neutral, keep routes clear, give facts - never rumours.", "ar": "تصرّفكم: حافظوا على هدوئكم وحيادكم، وأبقوا الطرق خالية، وقدّموا الحقائق - لا الشائعات أبدًا."}, {"en": "Report early: CALL SIGN → WHERE → WHAT → WHO → WHAT I'M DOING → OVER. No physical intervention.", "ar": "بلّغوا مبكرًا: رمز النداء ← أين ← ماذا ← من ← ماذا أفعل ← حوّل. لا تدخّل جسدي."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إن تعذّر الوصول إلى مشرفكم/مركز عمليات الملعب (VOC)): 911 رقم الطوارئ الموحّد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "agency-1": {"drawer": "agency", "code": "SMP 5.1", "released": true, "source": "smp51-moi-civil-defence-briefing/release/v12", "title": {"en": "Never", "ar": "أبدًا"}, "steps": [{"en": "Never: search, eject, hold, use force or take property.", "ar": "لا تفعلوا أبدًا: تفتيش أو إخراج أو إمساك أو استخدام قوة أو أخذ ممتلكات."}, {"en": "No rumours; no filming or posting on duty.", "ar": "لا إشاعات؛ ولا تصوير ولا نشر أثناء العمل."}]}, "agency-2": {"drawer": "agency", "code": "SMP 5.1", "released": true, "source": "smp51-moi-civil-defence-briefing/release/v12", "title": {"en": "Who leads?", "ar": "من يقود؟"}, "steps": [{"en": "Fire, smoke, gas, structure damage → Civil Defence | Evacuation → Civil Defence, as the venue plan sets it", "ar": "الحريق أو الدخان أو الغاز أو الأضرار الهيكلية ← الدفاع المدني | الإخلاء ← الدفاع المدني، وفقًا لما تحدده خطة الملعب."}, {"en": "Suspicious item, threat, fight, disorder, protest, refusing to leave → Police with Security", "ar": "غرض مشبوه أو تهديد أو شجار أو إخلال بالنظام أو احتجاج أو رفض المغادرة ← الشرطة بالتعاون مع الأمن."}, {"en": "Sick or injured → Red Crescent with Civil Defence", "ar": "مريض أو مصاب ← الهلال الأحمر بالتعاون مع الدفاع المدني."}, {"en": "All coordinated in the VOC", "ar": "تُنسّق جميع الجهات أعمالها في مركز عمليات الملعب (VOC)."}]}, "agency-3": {"drawer": "agency", "code": "SMP 5.1", "released": true, "source": "smp51-moi-civil-defence-briefing/release/v12", "title": {"en": "Security threat", "ar": "تهديد أمني"}, "steps": [{"en": "Security threat: Move away - Shelter - Tell.", "ar": "تهديد أمني: ابتعدوا - احتموا - أبلغوا."}, {"en": "Then follow police / Security.", "ar": "ثم اتبعوا الشرطة / الأمن."}]}, "agency-4": {"drawer": "agency", "code": "SMP 5.1", "released": true, "source": "smp51-moi-civil-defence-briefing/release/v12", "title": {"en": "My response steps", "ar": "خطوات استجابتي"}, "steps": [{"en": "1 Stay safe", "ar": "1 ابقوا آمنين"}, {"en": "2 Report in person: WHERE → WHAT → WHO → WHAT I'M DOING", "ar": "2 أبلغوا شخصيًا: أين ← ماذا ← من ← ماذا أفعل"}, {"en": "3 Keep people back, form a perimeter, routes clear (steps often happen together). Fans filming? Ask politely to stop: words only.", "ar": "3 بعّد الناس، وسوّ طوق، وخلّ الطرق مفتوحة (الخطوات غالبًا تصير مع بعض). المشجعين يصوّرون؟ اطلب منهم بأدب يوقفون: بالكلام فقط."}, {"en": "“Please stop filming and put your phones away.”", "ar": "\"لو سمحتوا وقّفوا التصوير وحطّوا جوالاتكم.\""}, {"en": "4 Follow the lead agency - authorised instruction within your role: confirm, act, tell your supervisor", "ar": "4 اتبعوا الجهة القائدة - تعليمات معتمدة ضمن دوركم: أكّدوا، ونفّذوا، أبلغوا مشرفكم"}, {"en": "5 Hand over (seen / told / not known) - confirm they've got it - note it", "ar": "5 سلّموا (ما رأيته / ما قيل لي / ما لا أعرفه) - تأكدوا أنهم فهموا - دوّنوا ذلك"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 (Riyadh, Makkah and Eastern regions) | 997 Red Crescent ambulance", "ar": "أرقام الطوارئ (فقط إذا لم تستطيعوا الوصول إلى مشرفكم/مركز عمليات الملعب (VOC)): 911 (مناطق الرياض ومكة المكرمة والشرقية) | 997 إسعاف الهلال الأحمر"}]}, "fire-1": {"drawer": "fire", "code": "SMP 5.2", "released": true, "source": "smp52-fire-safety/release/v7", "title": {"en": "Before gates open - E-X-I-T-S", "ar": "قبل فتح البوابات — فحص E-X-I-T-S"}, "steps": [{"en": "E Exits & routes open, unlocked, clear", "ar": "E — المخارج ومسارات الوصول مفتوحة وغير مقفلة وخالية."}, {"en": "X eXtinguishers - look, never touch. Report anything wrong.", "ar": "X - طفايات الحريق: راقبوا ولا تلمسوا أبدًا. أبلغوا عن أي خلل."}, {"en": "I Ignition - no smoking, safe cables, gas away from heat", "ar": "I — مصادر الاشتعال: لا تدخين، وأسلاك آمنة، والغاز بعيد عن الحرارة."}, {"en": "T Trash cleared", "ar": "T — أزيلوا النفايات."}, {"en": "S Signs lit, fire doors closed - never wedged, never locked", "ar": "S — اللافتات مضاءة، وأبواب الحريق مغلقة — لا تسندوها أو تقفلوها أبدًا."}, {"en": "Quick & safe? Fix + tell supervisor. Can't? Report now - open until fixed.", "ar": "هل يمكنكم معالجة الخلل بسرعة وأمان؟ عالجوه وأبلغوا المشرف. إذا تعذّر ذلك، فأبلغوا عنه فورًا — ويظل البلاغ مفتوحًا حتى معالجة الخلل."}, {"en": "Locked exit: report and STAY (from a safe position).", "ar": "المخرج المقفل: أبلغوا عنه وابقوا بالقرب منه (في مكان آمن)."}]}, "fire-2": {"drawer": "fire", "code": "SMP 5.2", "released": true, "source": "smp52-fire-safety/release/v7", "title": {"en": "Fire or smoke - R.I.E.F.A.", "ar": "حريق أو دخان — R.I.E.F.A."}, "steps": [{"en": "R Raise the alarm - radio 'Incident White' (no radio or no reply: fallback per briefing)", "ar": "R — أطلقوا الإنذار، وأبلغوا عبر اللاسلكي بوقوع «حادث أبيض» (إذا لم يتوفر اللاسلكي أو لم يصلكم رد، فاتبعوا الإجراء البديل الموضح في الإحاطة)."}, {"en": "I Inform - WHERE - WHAT - WHO - WHAT I'M DOING", "ar": "I — أبلغوا: الموقع — ما حدث — الأشخاص — ما الذي تفعلونه."}, {"en": "E Ensure people move away - calm, give a direction", "ar": "E — تأكّدوا من ابتعاد الأشخاص عن الخطر — وجّهوهم بهدوء وحددوا لهم الاتجاه."}, {"en": "F Form a perimeter. Never fight the fire. Ask fans politely to stop filming.", "ar": "F - شكّلوا محيطًا أمنيًا. لا تكافحوا الحريق أبدًا. اطلبوا من الجماهير بأدب التوقف عن التصوير."}, {"en": "A Assist Civil Defence - they command", "ar": "A — ساعدوا الدفاع المدني — فهو يتولى القيادة."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 (Riyadh, Makkah and Eastern regions) | 997 Red Crescent ambulance", "ar": "أرقام الطوارئ (إذا تعذّر الوصول إلى مشرفكم أو مركز عمليات الملعب): 911 (في مناطق الرياض ومكة المكرمة والشرقية) | 997 إسعاف الهلال الأحمر."}]}, "fire-3": {"drawer": "fire", "code": "SMP 5.2", "released": true, "source": "smp52-fire-safety/release/v7", "title": {"en": "Your job at a fire", "ar": "دوركم عند الحريق"}, "steps": [{"en": "Filming: “Please stop filming and put your phone away. Let's respect this person's privacy and give the medical team space.”", "ar": "التصوير: «لو سمحتوا، أوقفوا التصوير وأبعدوا الجوالات، احترامًا لخصوصية الشخص اعطوا الفريق الطبي مساحة»"}, {"en": "Perimeter: 2–3 m around a single casualty; widen if the medical team asks or the situation grows; keep a route clear for the medics to arrive and leave, even with a stretcher.", "ar": "محيط أمني: من 2 إلى 3 م حول مصاب واحد؛ وسّعوه إذا طلب الفريق الطبي ذلك أو تفاقم الموقف؛ أبقوا طريقًا خاليًا لدخول المسعفين وخروجهم، حتى مع نقّالة."}, {"en": "Cordon", "ar": "طوق أمني"}, {"en": "Evacuation? Follow instructions - see Lesson 10.2 card.", "ar": "إخلاء؟ اتبعوا التعليمات - راجعوا بطاقة الدرس 10.2."}]}, "crowd-1": {"drawer": "crowd", "code": "SMP 6.1", "released": true, "source": "smp61-crowd-safety-matters/release/v4", "title": {"en": "How full is it?", "ar": "ما مدى الامتلاء؟"}, "steps": [{"en": "Fine - about 2 in a 1 m square; walk freely. Green.", "ar": "جيد - نحو 2 في مربع مساحته متر واحد؛ المشي بحرية. أخضر."}, {"en": "Busy - about 3; slower, small gaps. Orange.", "ar": "مزدحم - نحو 3؛ أبطأ، فجوات صغيرة. برتقالي."}, {"en": "Getting full - about 4; touching. Red, from 8 out of 10 full → REPORT NOW.", "ar": "يمتلئ - نحو 4؛ تلامس. أحمر، من «ممتلئ بنسبة 8 من 10» ← بلّغوا الآن."}, {"en": "At capacity - nearly 5; shoulder to shoulder. Red → REPORT URGENTLY.", "ar": "عند السعة - قرابة 5؛ كتف إلى كتف. أحمر ← بلّغوا بصورة عاجلة."}, {"en": "Getting full? Report NOW - don't wait for 'at capacity'.", "ar": "يمتلئ المكان؟ بلّغوا الآن - لا تنتظروا «عند السعة»."}]}, "crowd-2": {"drawer": "crowd", "code": "SMP 6.1", "released": true, "source": "smp61-crowd-safety-matters/release/v4", "title": {"en": "Danger signs - look & listen", "ar": "علامات الخطر - انظروا واستمعوا"}, "steps": [{"en": "Pushing; swaying / waves", "ar": "دفع؛ تمايل / موجات"}, {"en": "Shouting, screaming", "ar": "صراخ، عويل"}, {"en": "Distressed faces, children lifted", "ar": "وجوه في ضائقة، أطفال مرفوعون"}, {"en": "Arms pinned, climbing out", "ar": "أذرع محشورة، تسلق للخروج"}, {"en": "Flow slowing or stopping", "ar": "تدفق يبطؤ أو يتوقف"}, {"en": "Someone falls", "ar": "شخص يسقط"}, {"en": "Overheating, fainting", "ar": "حرارة شديدة، إغماء"}]}, "crowd-3": {"drawer": "crowd", "code": "SMP 6.1", "released": true, "source": "smp61-crowd-safety-matters/release/v4", "title": {"en": "Surge moments and hot-spots", "ar": "لحظات الاندفاع والنقاط الساخنة"}, "steps": [{"en": "SURGE MOMENTS: late arrivals - kick-off - goals - half-time - final whistle.", "ar": "لحظات الاندفاع: الوصول المتأخر، انطلاق المباراة، الأهداف، استراحة ما بين الشوطين، صافرة النهاية."}, {"en": "HOT-SPOTS: gates, stairways, vomitories, kiosks/toilets/prayer areas, exits, corners, last mile.", "ar": "النقاط الساخنة: البوابات، السلالم، ممرات الدخول، الأكشاك/دورات المياه/أماكن الصلاة، المخارج، الزوايا، الميل الأخير."}]}, "crowd-4": {"drawer": "crowd", "code": "SMP 6.1", "released": true, "source": "smp61-crowd-safety-matters/release/v4", "title": {"en": "What I do", "ar": "ما أفعله"}, "steps": [{"en": "Face the crowd", "ar": "واجهوا الحشد"}, {"en": "Report early (CALL SIGN → WHERE → WHAT → WHO → WHAT I'M DOING → OVER)", "ar": "بلّغوا مبكرًا (اسم النداء ← أين ← ماذا ← من ← ماذا أفعل ← حوّل)"}, {"en": "Keep routes clear", "ar": "أبقوا الطرق خالية"}, {"en": "Direct to space", "ar": "التوجيه نحو المساحة"}, {"en": "Stop & Go only on instruction", "ar": "الإيقاف والتحرّك عند التعليمات فقط"}, {"en": "Never push, never step into a dense crowd", "ar": "لا تدفعوا ولا تدخلوا حشدًا كثيفًا أبدًا"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف/مركز عمليات الملعب): 911 رقم الطوارئ الموحد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "queue-1": {"drawer": "queue", "code": "SMP 7.1", "released": true, "source": "smp71-ingress-queues/release/v9", "title": {"en": "During the queue", "ar": "أثناء الطابور"}, "steps": [{"en": "Soft ticket check: right match, gate, day", "ar": "التحقق المبدئي: المباراة والبوابة واليوم"}, {"en": "'Tickets ready, bags open for Security'", "ar": "«التذاكر جاهزة، والحقائب مفتوحة للأمن»"}, {"en": "Line-jumper: polite, explain, never grab - refuses? tell supervisor", "ar": "متجاوز الدور: بلطف، واشرحوا، ولا تمسكوا به أبدًا؛ وإن رفض؟ أبلغوا المشرف"}, {"en": "Tell fans what's happening and how long", "ar": "أخبروا المشجعين بما يحدث وكم سيستغرق"}, {"en": "Queue growing faster than it moves? Report early", "ar": "الطابور ينمو أسرع من حركته؟ بلّغوا مبكرًا"}]}, "queue-2": {"drawer": "queue", "code": "SMP 7.1", "released": true, "source": "smp71-ingress-queues/release/v9", "title": {"en": "Before gates open", "ar": "قبل فتح البوابات"}, "steps": [{"en": "Barriers linked - no gaps to slip through", "ar": "حواجز مربوطة، بلا فراغات يتسلل منها أحد"}, {"en": "Lanes even; gaps between lanes clear", "ar": "مسارات متساوية؛ والفراغات بين المسارات خالية"}, {"en": "Emergency lane marked and EMPTY", "ar": "مسار الطوارئ محدد وخالٍ تمامًا"}, {"en": "Exits not blocked by barriers", "ar": "المخارج غير مسدودة بالحواجز"}, {"en": "On your Dot Plan position, facing the fans", "ar": "في موقعكم على خطة التمركز (Dot Plan)، تواجهون المشجعين"}, {"en": "Report: 'Queue ready, lane clear'", "ar": "أبلغوا: «الطابور جاهز، المسار خالٍ»"}]}, "queue-3": {"drawer": "queue", "code": "SMP 7.1", "released": true, "source": "smp71-ingress-queues/release/v9", "title": {"en": "Only on instruction", "ar": "فقط بناءً على التعليمات"}, "steps": [{"en": "Change the queue, open a lane or a gate? Only on instruction - read it back, check the lane, report.", "ar": "تغيير الطابور أو فتح مسار أو بوابة؟ فقط بناءً على التعليمات: كرّروها للتأكيد، وتأكدوا من المسار، وبلّغوا."}, {"en": "Marshals never search. Security screen at the check point.", "ar": "المنظِّمون لا يفتّشون أبدًا. رجال الأمن يفحصون عند نقطة التفتيش الأمني."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC):", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى مشرفكم أو مركز عمليات الملعب):"}, {"en": "911 unified emergency number", "ar": "911 الرقم الموحد للطوارئ"}, {"en": "998 Civil Defence", "ar": "998 الدفاع المدني"}, {"en": "997 Red Crescent ambulance", "ar": "997 إسعاف الهلال الأحمر"}]}, "egress-1": {"drawer": "egress", "code": "SMP 8.1", "released": true, "source": "smp81-egress-stop-hold/release/v8", "title": {"en": "Stop & Go - only on instruction", "ar": "الإيقاف والتحرّك - بتعليمات فقط"}, "steps": [{"en": "1 CONFIRM - read it back", "ar": "1 التأكيد - كرّروا التعليمات"}, {"en": "2 POSITION - hold line, with a teammate", "ar": "2 التمركز - خط الانتظار، مع زميل"}, {"en": "3 SIGNAL - STOP, then HOLD", "ar": "3 الإشارة - توقف ثم انتظار"}, {"en": "4 EXPLAIN - 'Please wait a moment - it's for your safety'", "ar": "4 الشرح - «انتظروا لحظة - هذا لسلامتكم»"}, {"en": "5 WATCH - back of the crowd, emergency lane", "ar": "5 المراقبة - مؤخرة الحشد، مسار الطوارئ"}, {"en": "6 UPDATE - short radio messages", "ar": "6 التحديث - رسائل لاسلكية قصيرة"}, {"en": "Release: on instruction - GO-MOVE - gradually", "ar": "الإفراج: بتعليمات - تحرّك (GO-MOVE) - تدريجيًا"}]}, "egress-2": {"drawer": "egress", "code": "SMP 8.1", "released": true, "source": "smp81-egress-stop-hold/release/v8", "title": {"en": "Egress", "ar": "الخروج"}, "steps": [{"en": "Half-time: stay at your post", "ar": "بين الشوطين: ابقوا في موقعكم"}, {"en": "Last part of match: move to egress position when told", "ar": "آخر المباراة: انتقلوا إلى نقطة التمركز للخروج عند إخباركم"}, {"en": "Face the crowd; stay until stood down", "ar": "واجهوا الحشد؛ ابقوا حتى إنهاء المناوبة"}, {"en": "Stair head: 'Walk, please - use the handrail'; nobody on the stairs", "ar": "رأس الدرج: «من فضلكم، امشوا - استخدموا الدرابزين»؛ لا أحد على الدرج"}, {"en": "Exit gates open and clear", "ar": "بوابات الخروج مفتوحة وخالية"}, {"en": "Area empty: SWEEP → REPORT → STAND DOWN", "ar": "المنطقة فارغة: تفقد ← إبلاغ ← إنهاء المناوبة"}]}, "egress-3": {"drawer": "egress", "code": "SMP 8.1", "released": true, "source": "smp81-egress-stop-hold/release/v8", "title": {"en": "See danger?", "ar": "رأيتم خطرًا؟"}, "steps": [{"en": "See danger? Report straight away - ask for a hold.", "ar": "رأيتم خطرًا؟ بلّغوا فورًا - واطلبوا التثبيت."}, {"en": "Never start or end one on your own.", "ar": "لا تبدؤوا التثبيت ولا تنهوه بمفردكم أبدًا."}, {"en": "Never link arms, push, or redirect into a route you have not been told is open.", "ar": "لا تشبكوا الأذرع ولا تدفعوا ولا تعيدوا التوجيه إلى مسار لم يُبلَّغ أنه مفتوح أبدًا."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC):", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف/مركز عمليات الملعب):"}, {"en": "911 unified emergency number", "ar": "911 رقم الطوارئ الموحد"}, {"en": "998 Civil Defence", "ar": "998 الدفاع المدني"}, {"en": "997 Red Crescent ambulance", "ar": "997 إسعاف الهلال الأحمر"}]}, "report-1": {"drawer": "report", "code": "SMP 9.1", "released": true, "source": "smp91-radio-escalation-reporting/release/v6", "title": {"en": "Escalation ladder", "ar": "سلّم التصعيد"}, "steps": [{"en": "Not everyone will have a radio. If you do not have a radio, use the chain of communication.", "ar": "لن يكون لدى الجميع جهاز لاسلكي. إذا لم يكن لديكم جهاز لاسلكي، فاستخدموا سلسلة التواصل."}, {"en": "Supervisor first - every issue, every time.", "ar": "أبلغوا المشرف أولًا، في كل مشكلة وفي كل مرة."}, {"en": "No supervisor? Report to the nearest colleague and begin the communication chain.", "ar": "إذا لم يكن المشرف موجودًا، فأبلغوا أقرب زميل وابدؤوا سلسلة التواصل."}, {"en": "Danger to life right now? Move people away, call the nearest Security, police or medical team - then report.", "ar": "هل حياة أحدهم في خطر الآن؟ أبعدوا الناس عن الخطر، واستعينوا بأقرب فرد من الأمن أو الشرطة أو الفريق الطبي، ثم أبلغوا."}, {"en": "Never go silent - update when things change.", "ar": "لا تتوقفوا عن الإبلاغ؛ أرسلوا تحديثًا كلما تغيّر الوضع."}, {"en": "Can't reach anyone? 911.", "ar": "إذا لم تتمكنوا من الوصول إلى أحد، فاتصلوا على 911."}]}, "report-2": {"drawer": "report", "code": "SMP 9.1", "released": true, "source": "smp91-radio-escalation-reporting/release/v6", "title": {"en": "Radio steps", "ar": "خطوات اللاسلكي"}, "steps": [{"en": "THINK - LISTEN - PRESS - PAUSE - SPEAK - RELEASE", "ar": "فكّروا - استمعوا - اضغطوا - انتظروا - تكلّموا - اتركوا الزر"}, {"en": "Radio A-B-C: Accurate - Brief - Clear", "ar": "ABC اللاسلكي: دقيق - موجز - واضح"}, {"en": "Spell letters: Gate Bravo / Gate Delta", "ar": "تهجّوا الحروف: البوابة Bravo / البوابة Delta"}]}, "report-3": {"drawer": "report", "code": "SMP 9.1", "released": true, "source": "smp91-radio-escalation-reporting/release/v6", "title": {"en": "Radio words", "ar": "كلمات اللاسلكي"}, "steps": [{"en": "Radio check - Go ahead - Copy that - Over", "ar": "فحص الاتصال - تفضّل - تم الاستلام - حوّل"}, {"en": "Out - Stand by - Say again - All call", "ar": "انتهى - انتظر - كرر - نداء عام"}, {"en": "My call sign: {field:callSign} - Supervisor: {field:supervisor}", "ar": "رمز ندائي: {field:callSign} - المشرف: {field:supervisor}"}, {"en": "Area Leader: {field:areaLeader} - Channel: {field:channel}", "ar": "قائد المنطقة: {field:areaLeader} - القناة: {field:channel}"}]}, "report-4": {"drawer": "report", "code": "SMP 9.1", "released": true, "source": "smp91-radio-escalation-reporting/release/v6", "title": {"en": "What to say", "ar": "ماذا تقولون"}, "steps": [{"en": "Incident - Item of Interest - Medical Assistance", "ar": "حادث - غرض محل اهتمام - طلب مساعدة طبية"}, {"en": "Disturbance - Security Assistance - Incident White", "ar": "إخلال بالنظام - مساعدة أمنية - حادث أبيض"}, {"en": "NEVER on air: bomb, fight, fire, heart attack, names, phone numbers", "ar": "يُمنع ذكرها عبر اللاسلكي: قنبلة، شجار، حريق، نوبة قلبية، أسماء، أرقام هواتف."}, {"en": "Hand signals: arms crossed above the head = Emergency | palm opens and closes every 3 s = Need supervisor (the same signal back = COPY) | fists bumped on top of the head = Area full / Close entry | one thumb up = All clear / OK | hands make a T above the head = Need relief / Break | both thumbs up = Release (open the area slowly, under control)", "ar": "إشارات اليد: الذراعان معقودتان فوق الرأس = طوارئ | تنفتح الكف وتنغلق كل 3 ثوانٍ = أحتاج إلى المشرف (الإشارة نفسها في المقابل = تم الاستلام) | ضرب القبضتين فوق الرأس = المنطقة ممتلئة / أغلقوا الدخول | رفع إبهام واحد = الوضع آمن / حسنًا | حرف T باليدين فوق الرأس = أحتاج إلى بديل / استراحة | رفع الإبهامين = الإفراج (افتحوا المنطقة ببطء وتحت السيطرة)"}, {"en": "Form: time - place - what happened (in order) - who - how many - what I did / who I told. Facts only. Hand to supervisor.", "ar": "النموذج: الوقت - الموقع - ما حدث (بالترتيب) - مَن المعني - العدد - ما فعلتم / مَن أبلغتم. اكتبوا الحقائق فقط، ثم سلّموا النموذج إلى المشرف."}, {"en": "No form on you? Note it in your notebook, then copy it to the form as soon as you safely can.", "ar": "إذا لم يكن النموذج معكم، دوّنوا المعلومات في دفتر ملاحظاتكم، ثم انقلوها إلى النموذج في أقرب وقت ممكن بعد أن يصبح ذلك آمنًا."}]}, "conflict-1": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "THE MARSHAL'S LINE", "ar": "خط المنظِّم"}, "steps": [{"en": "OBSERVE - CALM WITH WORDS - REPORT - ESCALATE", "ar": "راقب - هدّئ بالكلام - أبلغ - صعّد"}, {"en": "NEVER touch, hold, block or remove anyone", "ar": "لا تلمس أحدًا أبدًا ولا تمسكه ولا تحاصره ولا تُخرجه"}, {"en": "Don't say: 'Calm down!' | 'Rules are rules' | 'Not my problem'", "ar": "لا تقل: «اهدأ!» | «القواعد قواعد» | «ليست مشكلتي»"}, {"en": "Say: 'I can see you're upset' | 'Let me find out' | 'This way, please'", "ar": "قل: «أرى أنك منزعج» | «دعني أتحقق لك» | «تفضل من هنا»"}]}, "conflict-2": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "AMBER AND RED - THE SIGNS", "ar": "البرتقالي والأحمر - العلامات"}, "steps": [{"en": "Frustration -> Anger -> Aggression -> Violence", "ar": "الإحباط -> الغضب -> العدوانية -> العنف"}, {"en": "AMBER (warning): Raised voice, Pointing, Red face, Staring, Moving closer, Big arm movements, Swearing. Slow down, listen, keep your space, tell your supervisor.", "ar": "برتقالي (تحذير): رفع الصوت، الإشارة بالأصابع، احمرار الوجه، التحديق، الاقتراب، تحريك الذراعين بعنف، الشتائم. تمهّل. استمع. حافظ على مسافتك. أخبر المشرف."}, {"en": "RED (danger): Face goes pale, Fists clench, Hands come up above the waist, Shoulders tense, Quick glances at a target or exit, Body drops lower, Goes suddenly quiet. Step back NOW, get distance, call Security.", "ar": "أحمر (خطر): شحوب الوجه، قبض اليدين، رفع اليدين فوق مستوى الخصر، توتر الكتفين، نظرات خاطفة نحو هدف أو مخرج، انخفاض الجسم إلى وضعية أخفض، الصمت فجأة. تراجع الآن. ابتعد. نادِ الامن."}]}, "conflict-3": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "STAY SAFE", "ar": "حافظ على سلامتك"}, "steps": [{"en": "Side-on, hands open, 1-3 m", "ar": "بزاوية جانبية، الأيدي مفتوحة، 1-3 م"}, {"en": "Keep a way out; never corner anyone", "ar": "أبقِ مخرجًا؛ لا تحاصر أحدًا في زاوية أبدًا"}, {"en": "Work in pairs: contact and cover", "ar": "اعمل في ثنائيات: المتحدث والمساند"}, {"en": "Before you go: TACT (Think - Assess - Consider - Take the safest action) + SEW", "ar": "قبل أن تذهب: TACT (فكّر - قيّم - فكّر في الخيارات - اتخذ الإجراء الأكثر أمانًا) + SEW"}, {"en": "NEVER touch, hold, block or remove anyone", "ar": "لا تلمس أحدًا أبدًا ولا تمسكه ولا تحاصره ولا تُخرجه"}]}, "conflict-4": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "CALM IT", "ar": "هدّئ الموقف"}, "steps": [{"en": "L - Listen: let them speak; nod", "ar": "L - استمع: دعهم يتكلمون؛ أومئ برأسك"}, {"en": "E - Empathise: 'I understand …'", "ar": "E - تعاطف: «أفهمك …»"}, {"en": "A - Ask: helpful questions", "ar": "A - اسأل: أسئلة مفيدة"}, {"en": "P - Propose: give options", "ar": "P - اقترح: قدّم خيارات"}, {"en": "Say: 'I can see you're upset' | 'Let me find out' | 'This way, please'", "ar": "قل: «أرى أنك منزعج» | «دعني أتحقق لك» | «تفضل من هنا»"}, {"en": "Don't say: 'Calm down!' | 'Rules are rules' | 'Not my problem'", "ar": "لا تقل: «اهدأ!» | «القواعد قواعد» | «ليست مشكلتي»"}]}, "conflict-5": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "GROUND RULES", "ar": "قواعد الملعب"}, "steps": [{"en": "Ground rules: explain - ask - report. Never take items.", "ar": "قواعد الملعب: اشرح - اطلب - أبلغ. لا تأخذ الأغراض أبدًا."}, {"en": "Flare? Don't touch - report; lit = Incident White.", "ar": "شعلة نارية؟ لا تلمسها - أبلغ؛ مشتعلة = حادث من الفئة البيضاء."}, {"en": "Seat dispute: greet both sides - check both tickets - show the right seats - still stuck? Call your supervisor", "ar": "خلاف على المقاعد: حيِّ الطرفين - تحقق من التذكرتين - أرشد إلى المقاعد الصحيحة - ما زال عالقًا؟ نادِ المشرف"}]}, "conflict-6": {"drawer": "conflict", "code": "SMP 9.2", "released": false, "source": "smp92-conflict-deescalation/content/a2-script (not yet released)", "title": {"en": "WALK AWAY - AND AFTERWARDS", "ar": "انسحب - وما بعد ذلك"}, "steps": [{"en": "Stuck? Exit line - pass it on", "ar": "عالق؟ عبارة الانسحاب - سلّم الموقف"}, {"en": "Radio: 'Disturbance' or 'Security Assistance' + WHERE - WHAT - WHO - WHAT I'M DOING", "ar": "عبر الجهاز اللاسلكي: «إخلال بالنظام» أو «مساعدة أمنية» + أين - ماذا - من - ماذا أفعل"}, {"en": "Afterwards: Incident Report Form; water; talk to your supervisor", "ar": null}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذر الوصول إلى المشرف أو مركز عمليات الملعب): 911 الرقم الموحد للطوارئ | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "lost-1": {"drawer": "lost", "code": "SMP 9.3", "released": true, "source": "smp93-safeguarding-lost-persons/release/v7", "title": {"en": "SAFEGUARDING", "ar": "الحماية"}, "steps": [{"en": "RECOGNISE - DON'T INVESTIGATE - REPORT", "ar": "لاحظ - لا تحقق بنفسك - بلغ"}, {"en": "Danger now? Nearest Security / police, then report.", "ar": "خطر الآن؟ أقرب فرد من الامن / الشرطة، ثم بلغوا."}, {"en": "Woman or girl? Ask a female colleague to help.", "ar": "امرأة أو فتاة؟ اطلبوا من زميلة أن تساعد."}]}, "lost-2": {"drawer": "lost", "code": "SMP 9.3", "released": true, "source": "smp93-safeguarding-lost-persons/release/v7", "title": {"en": "SOMEONE IS LOST", "ar": "شخص مفقود"}, "steps": [{"en": "1 Calm the person reporting", "ar": "1 هدّئوا الشخص المُبلِّغ"}, {"en": "2 Describe: age, boy/girl, height, hair, clothes, name - where and when last seen", "ar": "2 صِفوا: العمر، ولد/بنت، الطول، الشعر، الملابس، الاسم - وأين ومتى شوهد آخر مرة"}, {"en": "3 Look around your area (stay at post)", "ar": "3 انظروا حول منطقتكم (ابقوا في موقعكم)"}, {"en": "4 Call your supervisor", "ar": "4 اتصلوا بالمشرف"}, {"en": "Note the reporter's name and seat number; ask them to stay until your supervisor arrives", "ar": "سجّلوا اسم المُبلِّغ ورقم مقعده؛ واطلبوا منه البقاء حتى يصل المشرف"}, {"en": "-> Supervisor takes over: same place, 15 minutes, wait for instructions", "ar": "-> المشرف يتولى الأمر: المكان نفسه، 15 دقيقة، انتظار التعليمات"}]}, "lost-3": {"drawer": "lost", "code": "SMP 9.3", "released": true, "source": "smp93-safeguarding-lost-persons/release/v7", "title": {"en": "SOMEONE IS FOUND", "ar": "شخص تم العثور عليه"}, "steps": [{"en": "1 Introduce yourself - 'I work for the event'", "ar": "1 عرّفوا بأنفسكم - «أنا أعمل في الفعالية»"}, {"en": "2 Check for an ID wristband", "ar": "2 تحققوا من وجود سوار تعريف"}, {"en": "3 Girl or woman? Female colleague", "ar": "3 فتاة أو امرأة؟ زميلة"}, {"en": "4 Stay with them - same place, public view", "ar": "4 ابقوا معه - المكان نفسه، على مرأى من الناس"}, {"en": "5 Call your supervisor", "ar": "5 اتصلوا بالمشرف"}, {"en": "-> Hand-over ONLY through supervisor to: ______ (write the name from your briefing)", "ar": "-> التسليم فقط عبر المشرف إلى: ______ (اكتبوا الاسم من الإحاطة)"}, {"en": "Info Point: ______ (write where from your briefing)", "ar": "نقطة المعلومات: ______ (اكتبوا المكان من الإحاطة)"}]}, "lost-4": {"drawer": "lost", "code": "SMP 9.3", "released": true, "source": "smp93-safeguarding-lost-persons/release/v7", "title": {"en": "PRIVACY", "ar": "الخصوصية"}, "steps": [{"en": "No names on open radio", "ar": "لا أسماء عبر اللاسلكي المفتوح"}, {"en": "No photos", "ar": "لا صور"}, {"en": "Nothing on your phone or social media", "ar": "لا شيء على هاتفكم أو وسائل التواصل الاجتماعي"}, {"en": "Danger now? Nearest Security / police, then report.", "ar": "خطر الآن؟ أقرب فرد من الامن / الشرطة، ثم أبلغوا."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذر الوصول إلى المشرف أو مركز عمليات الملعب): 911 الرقم الموحد للطوارئ | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "suspect-1": {"drawer": "suspect", "code": "SMP 10.1", "released": true, "source": "smp101-suspicious-items-hazard-response/release/v3", "title": {"en": "Unattended item? HOT (look only)", "ar": "غرض متروك؟ HOT (بالنظر فقط)"}, "steps": [{"en": "Stay calm - most bags are lost", "ar": "حافظوا على هدوئكم - معظم الحقائب مفقودة"}, {"en": "Ask: 'Is this yours? Did you see who left it?'", "ar": "اسألوا: «هل هذا لك؟ هل رأيت من تركه؟»"}, {"en": "H - Hidden?", "ar": "H - مخفي؟"}, {"en": "O - Obviously suspicious? (wires, batteries, tape, liquid, smell)", "ar": "O - مشبوه بشكل واضح؟ (أسلاك، بطاريات، شريط لاصق، سائل، رائحة)"}, {"en": "T - Normal for this place?", "ar": "T - طبيعي في هذا المكان؟"}, {"en": "Not suspicious? Still tell your supervisor", "ar": "ليس مشبوهًا؟ أخبروا مشرفكم مع ذلك"}]}, "suspect-2": {"drawer": "suspect", "code": "SMP 10.1", "released": true, "source": "smp101-suspicious-items-hazard-response/release/v3", "title": {"en": "Suspicious? Don't touch - step back - report", "ar": "إذا كان الغرض مشبوهًا: لا تلمسوه — ابتعدوا — أبلغوا."}, "steps": [{"en": "Don't touch, move, open or cover it", "ar": "لا تلمسوا الغرض أو تحرّكوه أو تفتحوه أو تغطّوه."}, {"en": "Move the people next to it away calmly", "ar": "إبعاد الأشخاص القريبين من الغرض بهدوء"}, {"en": "Step back 15 m before radio or phone - then out of sight, behind cover", "ar": "ابتعدوا مسافة 15 مترًا قبل استخدام جهاز اللاسلكي أو الهاتف، ثم ابتعدوا عن الأنظار واحتموا خلف ساتر."}, {"en": "'Sierra 2, this is Marshal 22 - Item of Interest - WHERE - WHAT - WHY - WHAT I'M DOING - OVER'", "ar": "«سييرا 2، معكم المنظِّم 22 — غرض محل اهتمام — أين - ماذا - لماذا - ماذا أفعل — حوّل»."}, {"en": "Keep the finder with you", "ar": "ابقوا مع الشخص الذي عثر على الغرض."}, {"en": "Wider cordon on instruction", "ar": "وسّعوا نطاق الطوق الأمني عند تلقي التعليمات."}, {"en": "Never say 'bomb'", "ar": "لا تقولوا أبدًا «قنبلة»."}]}, "suspect-3": {"drawer": "suspect", "code": "SMP 10.1", "released": true, "source": "smp101-suspicious-items-hazard-response/release/v3", "title": {"en": "Everyday hazards", "ar": "المخاطر اليومية"}, "steps": [{"en": "Everyday hazards: safe and simple? Fix it. Not? Report it and stay with it.", "ar": "المخاطر اليومية: آمن وبسيط؟ عالجوه. لا؟ أبلغوا عنه وابقوا بجانبه."}, {"en": "Damaged barrier? Ask fans to ease back - urgent radio call.", "ar": "حاجز تالف؟ اطلبوا من المشجعين التراجع - اتصال لاسلكي فوري."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number - Riyadh, Jeddah and Al Khobar | 998 Civil Defence outside those regions | 997 Red Crescent ambulance | 999 Police", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف/مركز عمليات الملعب): 911 رقم الطوارئ الموحد - الرياض وجدة والخبر | 998 الدفاع المدني خارج هذه المناطق | 997 إسعاف الهلال الأحمر | 999 الشرطة"}]}, "evac-1": {"drawer": "evac", "code": "SMP 10.2", "released": true, "source": "smp102-evacuation-signals-exit-gates/release/v3", "title": {"en": "Stand-by = get ready", "ar": "الاستعداد = استعدوا"}, "steps": [{"en": "Go to your evacuation post", "ar": "اذهبوا إلى موقع الإخلاء"}, {"en": "Check exits and routes clear and ready", "ar": "افحصوا أن المخارج والطرق خالية وجاهزة"}, {"en": "Open exit gates when told to - the evacuation message is an instruction", "ar": "افتحوا بوابات المخارج عند الأمر - رسالة الإخلاء هي التعليمة"}, {"en": "Stop people coming in if told", "ar": "أوقفوا الدخول إذا طُلب منكم"}, {"en": "Say nothing to fans yet", "ar": "لا تقولوا شيئًا للمشجعين الآن"}, {"en": "Danger right in front of you? Move people away - then report", "ar": "خطر أمامكم مباشرة؟ أبعدوا الناس - ثم أبلغوا"}]}, "evac-2": {"drawer": "evac", "code": "SMP 10.2", "released": true, "source": "smp102-evacuation-signals-exit-gates/release/v3", "title": {"en": "Evacuate = go (1)", "ar": "الإخلاء = اذهبوا (1)"}, "steps": [{"en": "Gate: open fully - secure - stand aside - no entry", "ar": "البوابة: افتحوها بالكامل - ثبّتوها - قفوا جانبًا - لا دخول"}, {"en": "Loud voice, big arm signals", "ar": "صوت عالٍ، إشارات ذراع كبيرة"}, {"en": "Keep a steady flow at the stair heads", "ar": "حافظوا على تدفق منتظم عند رؤوس الدرج"}, {"en": "No lifts. No going back. Away from danger", "ar": "لا مصاعد. لا عودة. بعيدًا عن الخطر"}]}, "evac-3": {"drawer": "evac", "code": "SMP 10.2", "released": true, "source": "smp102-evacuation-signals-exit-gates/release/v3", "title": {"en": "Evacuate = go (2)", "ar": "الإخلاء = اذهبوا (2)"}, "steps": [{"en": "Ask - stay - radio the exact location for fans who need help", "ar": "اسألوا، ابقوا، أبلغوا بالموقع الدقيق للمشجعين الذين يحتاجون إلى مساعدة"}, {"en": "Sweep toilets and prayer rooms if safe", "ar": "مشِّطوا دورات المياه والمصليات إن كان ذلك آمنًا"}, {"en": "Follow the last fan out - report at the assembly point", "ar": "اتبعوا آخر مشجع إلى الخارج - أبلغوا عند نقطة التجمع"}]}, "evac-4": {"drawer": "evac", "code": "SMP 10.2", "released": true, "source": "smp102-evacuation-signals-exit-gates/release/v3", "title": {"en": "Evacuation Action card", "ar": "بطاقة إجراءات الإخلاء"}, "steps": [{"en": "Invacuation / lockdown? Move fans to the safer area you are told; nobody in or out until the all-clear.", "ar": "الإيواء الداخلي / الإغلاق التام؟ انقلوا المشجعين إلى المنطقة الأكثر أمانًا المحددة لكم؛ لا دخول ولا خروج حتى انتهاء الخطر."}, {"en": "All clear? Return to your post and follow your supervisor.", "ar": "انتهاء الخطر؟ ارجعوا إلى موقعكم واتبعوا مشرفكم."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number - Riyadh, Jeddah and Al Khobar | 998 Civil Defence outside those regions | 997 Red Crescent ambulance | 999 Police", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف/مركز عمليات الملعب): 911 رقم الطوارئ الموحد - الرياض وجدة والخبر | 998 الدفاع المدني خارج هذه المناطق | 997 إسعاف الهلال الأحمر | 999 الشرطة"}]}, "shelter-1": {"drawer": "shelter", "code": "SMP 10.3", "released": true, "source": "smp103-missile-threat-emergency-response/release/v3", "title": {"en": "Civil Defence ask everyone to", "ar": "يطلب الدفاع المدني من الجميع"}, "steps": [{"en": "Stay calm", "ar": "حافظوا على هدوئكم."}, {"en": "Go to the nearest safe place - inside, inner area", "ar": "اذهبوا إلى أقرب مكان آمن - في الداخل، في منطقة داخلية."}, {"en": "Away from windows and glass", "ar": "ابتعدوا عن النوافذ والزجاج."}, {"en": "Avoid open areas, balconies, rooftops", "ar": "تجنبوا المناطق المفتوحة والشرفات والأسطح"}, {"en": "Don't film - don't approach anything fallen", "ar": "لا تصوّروا - لا تقتربوا من أي جسم ساقط"}, {"en": "Follow official instructions", "ar": "اتبعوا التعليمات الرسمية"}, {"en": "Stay until the all-clear", "ar": "ابقوا حتى انتهاء الخطر"}]}, "shelter-2": {"drawer": "shelter", "code": "SMP 10.3", "released": true, "source": "smp103-missile-threat-emergency-response/release/v3", "title": {"en": "Your role: move to shelter", "ar": "دوركم: وجّهوا المشجعين إلى أماكن الاحتماء"}, "steps": [{"en": "Stay at your post - listen for the instruction. No instruction after about 15 seconds? Tell your supervisor", "ar": "ابقوا في مواقعكم وترقّبوا التعليمات. إذا لم تصدر تعليمات بعد نحو 15 ثانية، فأبلغوا مشرفكم."}, {"en": "Shelter instruction? Lead fans calmly to the shelter area", "ar": "إذا صدرت تعليمات بالاحتماء، فقودوا المشجعين بهدوء إلى منطقة الاحتماء."}, {"en": "Don't send fans into open areas on your own", "ar": "لا توجّهوا المشجعين من تلقاء أنفسكم إلى المناطق المفتوحة."}, {"en": "Tents, glass and temporary structures are not shelter", "ar": "الخيام والزجاج والمنشآت المؤقتة ليست أماكن للاحتماء."}, {"en": "Gates: stop or redirect only on the VOC's instruction - words, never force", "ar": "عند البوابات، أوقفوا تدفق المشجعين أو غيّروا مسارهم فقط وفق تعليمات مركز عمليات الملعب. استخدموا الكلام، ولا تلجؤوا إلى القوة."}, {"en": "Shelter area getting full? Stop and tell your supervisor", "ar": "إذا أوشكت منطقة الاحتماء على الامتلاء، فتوقفوا وأبلغوا مشرفكم."}]}, "shelter-3": {"drawer": "shelter", "code": "SMP 10.3", "released": true, "source": "smp103-missile-threat-emergency-response/release/v3", "title": {"en": "Your role: in the shelter and after", "ar": "دوركم: في مكان الاحتماء وبعده"}, "steps": [{"en": "In shelter: inner walls, away from glass; crouch low and protect head and neck if told", "ar": "في الاحتماء: الجدران الداخلية، بعيداً عن الزجاج؛ انخفضوا واحموا الرأس والعنق إذا طُلب منكم"}, {"en": "Second alert? Stay put. No going back for belongings", "ar": "تنبيه ثانٍ؟ ابقوا في أماكنكم. لا عودة لأخذ الأغراض"}, {"en": "Help children, older fans and fans with special needs - radio exact locations", "ar": "ساعدوا الأطفال والمسنين وذوي الاحتياجات الخاصة - وأبلغوا بالمواقع الدقيقة عبر اللاسلكي"}, {"en": "Fallen object? 'Item of Interest' - don't approach", "ar": "جسم ساقط؟ «غرض محل اهتمام» - لا تقتربوا"}, {"en": "No filming, no rumours", "ar": "لا تصوير ولا شائعات"}, {"en": "All-clear? Wait for the instruction to move", "ar": "انتهاء الخطر؟ انتظروا التعليمات للتحرك"}, {"en": "Shelter yourself too. Then help others.", "ar": "احتموا أنتم أيضًا. ثم ساعدوا الآخرين."}]}, "shelter-4": {"drawer": "shelter", "code": "SMP 10.3", "released": true, "source": "smp103-missile-threat-emergency-response/release/v3", "title": {"en": "Calm words", "ar": "كلمات هادئة"}, "steps": [{"en": "'We're moving everyone to the safest place inside - stay with me, this way.'", "ar": "«ننقل الجميع إلى أكثر الأماكن أمانًا في الداخل - ابقوا معي، من هنا.»"}, {"en": "Shelter yourself too. Then help others.", "ar": "احتموا أنتم أيضًا. ثم ساعدوا الآخرين."}]}, "shelter-5": {"drawer": "shelter", "code": "SMP 10.3", "released": true, "source": "smp103-missile-threat-emergency-response/release/v3", "title": {"en": "My venue and emergency numbers", "ar": "أرقام ملعبي والطوارئ"}, "steps": [{"en": "My shelter area: ________________", "ar": "منطقة الاحتماء الخاصة بي: ________________"}, {"en": "Radio code word: ________________", "ar": "الكلمة الرمزية على اللاسلكي: ______"}, {"en": "Fill these in at your venue briefing, on the shelter-route walk-through", "ar": "املؤوا هذه في إحاطة الملعب، أثناء جولة مسار الاحتماء"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number - Riyadh, Jeddah and Al Khobar | 998 Civil Defence outside those regions | 997 Red Crescent ambulance | 999 Police", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى المشرف/مركز عمليات الملعب): 911 رقم الطوارئ الموحد - الرياض وجدة والخبر | 998 الدفاع المدني خارج هذه المناطق | 997 إسعاف الهلال الأحمر | 999 الشرطة"}]}, "medical-1": {"drawer": "medical", "code": "SMP 11.1", "released": true, "source": "smp111-medical-emergencies-cpr/release/v3", "title": {"en": "Know before gates open", "ar": "تأكدوا من معرفة المواقع التالية قبل فتح البوابات:"}, "steps": [{"en": "Medical room", "ar": "الغرفة الطبية"}, {"en": "First aid point", "ar": "نقطة الإسعافات الأولية"}, {"en": "Mobile team", "ar": "موقع الفريق الطبي المتنقل"}, {"en": "Nearest AED", "ar": "أقرب جهاز الصدمات (AED)"}, {"en": "Medics' route", "ar": "مسار وصول المسعفين"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (لا تتصلوا بها إلا إذا تعذّر عليكم التواصل مع مشرفكم أو مركز عمليات الملعب (VOC)): 911 — رقم الطوارئ الموحد | 998 — الدفاع المدني | 997 — إسعاف الهلال الأحمر"}]}, "medical-2": {"drawer": "medical", "code": "SMP 11.1", "released": true, "source": "smp111-medical-emergencies-cpr/release/v3", "title": {"en": "Recognise - call at once", "ar": "تعرّفوا على الحالة، واتصلوا فورًا"}, "steps": [{"en": "Fainting - still call medical", "ar": "الإغماء — اطلبوا المساعدة الطبية أيضًا."}, {"en": "Dehydration / heat exhaustion - shade, call medical", "ar": "الجفاف أو الإنهاك الحراري — انقلوا المصاب إلى الظل، واطلبوا المساعدة الطبية."}, {"en": "Heat stroke (hot, confused, collapse) - Medical Assistance at once", "ar": "ضربة الشمس (حرارة شديدة، وارتباك، وانهيار) — بلّغوا «طلب مساعدة طبية» فورًا."}, {"en": "Not responding + not breathing normally - 'Medical Assistance - not breathing'; send for the AED; CPR by a trained person", "ar": "عدم الاستجابة مع عدم التنفس بشكل طبيعي — بلّغوا «طلب مساعدة طبية — المصاب لا يتنفس»، وأرسلوا أحدًا لإحضار جهاز الصدمات (AED)، وليبدأ الإنعاش القلبي الرئوي شخصٌ مدرّب."}, {"en": "Never give medicine or food. Water only if fully awake and the medics or your supervisor agree", "ar": "لا تعطوا المصاب دواءً أو طعامًا. لا تقدّموا له الماء إلا إذا كان مستيقظًا تمامًا، وبعد موافقة المسعفين أو مشرفكم."}]}, "medical-3": {"drawer": "medical", "code": "SMP 11.1", "released": true, "source": "smp111-medical-emergencies-cpr/release/v3", "title": {"en": "Stay - call - guide", "ar": "ابقَ - اتصل - أرشد"}, "steps": [{"en": "Can walk? Walk them to the medical room / first aid point", "ar": "يستطيع المشي؟ امشوا معه إلى الغرفة الطبية / نقطة الإسعافات الأولية"}, {"en": "Can't walk? Don't move them", "ar": "لا يستطيع المشي؟ لا تحرّكوه"}, {"en": "STAY - calm, reassure, help is coming", "ar": "ابقَ - هدوء، طمأنة، المساعدة في الطريق"}, {"en": "CALL - 'Sierra 2, Marshal 22 - Medical Assistance - WHERE - WHAT - WHO - WHAT I'M DOING - OVER'", "ar": "اتصل - «سييرا 2، المنظّم 22 - طلب مساعدة طبية - أين - ماذا - من - ماذا أفعل - حوّل»"}, {"en": "GUIDE - send someone to meet the medics; keep the route clear", "ar": "أرشد - أرسلوا شخصاً لاستقبال المسعفين؛ أبقوا الطريق خالياً"}, {"en": "Stay until the medics release you", "ar": "ابقوا حتى يأذن لكم المسعفون بالذهاب"}]}, "medical-4": {"drawer": "medical", "code": "SMP 11.1", "released": true, "source": "smp111-medical-emergencies-cpr/release/v3", "title": {"en": "Around the scene", "ar": "حول موقع الحالة"}, "steps": [{"en": "Space - calm ring - dignity - no filming - keep stairs moving.", "ar": "أفسحوا المجال — شكّلوا حلقة هادئة — صونوا كرامة المصاب — امنعوا التصوير — حافظوا على انسيابية الحركة على السلالم."}]}, "medical-5": {"drawer": "medical", "code": "SMP 11.1", "released": true, "source": "smp111-medical-emergencies-cpr/release/v3", "title": {"en": "My medical points", "ar": "نقاطي الطبية"}, "steps": [{"en": "Medical room: {field:medRoom}", "ar": "الغرفة الطبية: {field:medRoom}"}, {"en": "First aid point: {field:firstAid}", "ar": "نقطة الإسعافات الأولية: {field:firstAid}"}, {"en": "Nearest AED: {field:aed}", "ar": "أقرب جهاز صدمات: {field:aed}"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (لا تتصلوا بها إلا إذا تعذّر عليكم التواصل مع مشرفكم أو مركز عمليات الملعب (VOC)): 911 — رقم الطوارئ الموحد | 998 — الدفاع المدني | 997 — إسعاف الهلال الأحمر"}]}, "access-1": {"drawer": "access", "code": "SMP 12.1", "released": true, "source": "smp121-disability-assisting-fans/release/v8", "title": {"en": "Ask first - every time", "ar": "استأذنوا أولًا، في كل مرة."}, "steps": [{"en": "Offer - 'Would you like any help?'", "ar": "اعرضوا المساعدة: «هل ترغبون في أي مساعدة؟»"}, {"en": "Listen - 'No, thank you' is a full answer", "ar": "أصغوا؛ فقول «لا، شكرًا» إجابة كافية."}, {"en": "Ask how - 'How can I best help?'", "ar": "اسألوا عن الطريقة المناسبة: «كيف يمكنني مساعدتكم؟»"}, {"en": "Speak to the fan, not the companion", "ar": "تحدثوا إلى المشجع نفسه، لا إلى مرافِقه."}, {"en": "Never judge by looks - many special needs are hidden", "ar": "لا تحكموا على أحد من مظهره؛ فكثير من الاحتياجات الخاصة غير ظاهرة."}, {"en": "Woman fan needs physical help? Offer a female colleague", "ar": "إذا احتاجت مشجعة إلى مساعدة جسدية، فاعرضوا الاستعانة بزميلة."}]}, "access-2": {"drawer": "access", "code": "SMP 12.1", "released": true, "source": "smp121-disability-assisting-fans/release/v8", "title": {"en": "By need", "ar": "حسب الحاجة"}, "steps": [{"en": "Wheelchair / mobility - never push, touch or lean on a chair or aid without permission; doors, slopes, space", "ar": "الكرسي المتحرك / محدودية الحركة - لا تدفعوا كرسياً أو أداة مساعدة ولا تلمسوها ولا تتكئوا عليها دون إذن؛ الأبواب والمنحدرات والمساحة"}, {"en": "Blind / low vision - introduce yourself; offer your arm; describe steps; say when you leave", "ar": "كفيف / ضعيف البصر - عرّفوا بأنفسكم؛ اعرضوا ذراعكم؛ صِفوا الدرجات؛ قولوا عند مغادرتكم"}, {"en": "Deaf / hard of hearing - wave, face them, speak clearly, write it", "ar": "أصم / ضعيف السمع - لوّحوا، واجهوهم، تحدثوا بوضوح، اكتبوا"}, {"en": "Speech / learning - patient, simple, one question, check", "ar": "النطق / التعلم - الصبر، البساطة، سؤال واحد، التأكد"}, {"en": "Overwhelmed - calm, few words, space, quieter spot", "ar": "مرهقون - هدوء، كلام قليل، مساحة، مكان أهدأ"}]}, "access-3": {"drawer": "access", "code": "SMP 12.1", "released": true, "source": "smp121-disability-assisting-fans/release/v8", "title": {"en": "Services and emergencies", "ar": "الخدمات والطوارئ"}, "steps": [{"en": "Services: wheelchair service, golf cart, accessible seating", "ar": "الخدمات: خدمة الكراسي المتحركة، عربة الغولف، مقاعد مهيأة لذوي الاحتياجات الخاصة"}, {"en": "To request them: tell your supervisor or the Accessibility team", "ar": "لطلبها: أخبروا مشرفكم أو فريق إمكانية الوصول"}, {"en": "Emergency? Make sure Deaf and blind fans know.", "ar": "طوارئ؟ تأكدوا أن المشجعين الصم والمكفوفين يعرفون."}, {"en": "Tell your supervisor where fans needing help are.", "ar": "أخبروا مشرفكم أين المشجعون الذين يحتاجون مساعدة."}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إن تعذّر الوصول إلى مشرفكم/مركز عمليات الملعب (VOC)): 911 رقم الطوارئ الموحّد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "routes-1": {"drawer": "routes", "code": "SMP 12.2", "released": true, "source": "smp122-accessible-routes-inclusion/release/v4", "title": {"en": "My area - accessible route (fill in at the venue walk)", "ar": "منطقتي - المسار المهيأ (املؤوه أثناء الجولة الميدانية في الملعب)"}, "steps": [{"en": "Accessible parking / drop-off: ________", "ar": "المواقف المخصصة لذوي الاحتياجات الخاصة / نقطة الإنزال: ________"}, {"en": "Golf cart / wheelchair service: ________", "ar": "عربة الغولف / خدمة الكراسي المتحركة: ________"}, {"en": "Accessible gate (staffed): ________", "ar": "البوابة المهيأة (بإشراف موظف): ________"}, {"en": "Lift(s): ________", "ar": "المصعد / المصاعد: ________"}]}, "routes-2": {"drawer": "routes", "code": "SMP 12.2", "released": true, "source": "smp122-accessible-routes-inclusion/release/v4", "title": {"en": "Who might need it - offer, don't assume", "ar": "من قد يحتاج إليها - اعرضوا، ولا تفترضوا"}, "steps": [{"en": "Persons with Special Needs", "ar": "ذوي الاحتياجات الخاصة"}, {"en": "Older fans", "ar": "المشجعون كبار السن"}, {"en": "Pregnant women", "ar": "النساء الحوامل"}, {"en": "Families with young children and strollers", "ar": "العائلات مع الأطفال الصغار وعربات الأطفال"}, {"en": "Fans with a temporary injury", "ar": "المشجعون المصابون إصابة مؤقتة"}, {"en": "Fans who are unwell or in distress", "ar": "المشجعون المتوعكون أو الذين في ضيق"}, {"en": "Speak to the fan - quietly - keep families together - female colleague for a woman needing physical help", "ar": "تحدثوا إلى المشجع - بهدوء - أبقوا أفراد العائلة معًا - زميلة للمرأة التي تحتاج إلى مساعدة مباشرة"}]}, "routes-3": {"drawer": "routes", "code": "SMP 12.2", "released": true, "source": "smp122-accessible-routes-inclusion/release/v4", "title": {"en": "In an evacuation", "ar": "عند الإخلاء"}, "steps": [{"en": "Evacuation: on instruction - no lift unless instructed - never carry", "ar": "الإخلاء: بناءً على التعليمات - لا مصعد إلا بتعليمات - لا حمل أبدًا"}, {"en": "'Sierra 2, Marshal 22. ________ (where). ________ (who needs help). I'm staying with them. Over.'", "ar": "«سييرا 2، المنظّم 22. ________ (أين). ________ (من يحتاج إلى المساعدة). سأبقى معهم. حوّل.»"}, {"en": "Emergency numbers (only if you cannot reach your supervisor/VOC): 911 unified emergency number | 998 Civil Defence | 997 Red Crescent ambulance.", "ar": "أرقام الطوارئ (فقط إذا تعذّر الوصول إلى مشرفكم / مركز عمليات الملعب): 911 رقم الطوارئ الموحّد | 998 الدفاع المدني | 997 إسعاف الهلال الأحمر."}]}, "routes-4": {"drawer": "routes", "code": "SMP 12.2", "released": true, "source": "smp122-accessible-routes-inclusion/release/v4", "title": {"en": "My area - accessible route (continued)", "ar": "منطقتي - المسار المهيأ (تابع)"}, "steps": [{"en": "Accessible seating + companion seats: ________", "ar": "المقاعد المهيأة + مقاعد المرافقين: ________"}, {"en": "Accessible toilet: ________", "ar": "دورة المياه المهيأة: ________"}, {"en": "Stroller storage: ________", "ar": "حفظ عربات الأطفال: ________"}, {"en": "Accessible lane: ________", "ar": "مسار ذوي الاحتياجات الخاصة: ________"}, {"en": "Keep it clear: ramps, lifts, accessible gates and toilets - report anything
